<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spielleiter-Toolkit – Gratis-Demo</title>
<meta name="description" content="Kampf-Tracker und Würfel für Spielleiter: Initiative, Lebenspunkte, Zustände, Waffen. Für D&D 5e, Pathfinder 2, DSA 5, Cthulhu 7, Shadowrun 6 und Splittermond. Offline, ohne Anmeldung.">
<meta property="og:title" content="Spielleiter-Toolkit – Gratis-Demo">
<meta property="og:description" content="Weniger merken, weniger blättern – mehr erzählen. Kampf-Tracker und Würfel für deinen Spieltisch, direkt im Browser.">
<meta property="og:image" content="https://ringolohse242-spec.github.io/spielleiter-toolkit/og.jpg">
<meta property="og:url" content="https://ringolohse242-spec.github.io/spielleiter-toolkit/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--radius:10px;--font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html[data-theme="dark"]{--bg:#0c0a0a;--panel:#161212;--panel2:#201919;--panel3:#2a2020;--border:#332828;--text:#f1e9e6;--muted:#a4958f;--accent:#d0182a;--accent-h:#e8303f;--accent-soft:rgba(208,24,42,.16);--on-accent:#fff;--danger:#ff5664;--ok:#45b06f;--warn:#e3a33a;--input:#0f0c0c;--shadow:0 10px 30px rgba(0,0,0,.55);--tag-p:#ff7a85;--tag-o:#e0b25a;--tag-f:#ff5664;--r2:#7fa2ff}
html[data-theme="clean"]{--bg:#ffffff;--panel:#ffffff;--panel2:#f4f4f4;--panel3:#e9e9e9;--border:#dddddd;--text:#111111;--muted:#666666;--accent:#111111;--accent-h:#333333;--accent-soft:rgba(0,0,0,.07);--on-accent:#ffffff;--danger:#b3261e;--ok:#2e7d4f;--warn:#a86a00;--input:#ffffff;--shadow:0 10px 30px rgba(0,0,0,.14);--tag-p:#111;--tag-o:#111;--tag-f:#b3261e;--r2:#555555}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh}
h1{font-size:24px;margin:0 0 2px;letter-spacing:-.2px}
h2{font-size:16px;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
kbd{font:11px/1 var(--font);border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:2px 5px;color:var(--muted);background:var(--panel2)}
.btn.primary kbd{background:transparent;color:inherit;border-color:rgba(255,255,255,.4);opacity:.85}
code{background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:0 4px;font-size:13px}

/* Header */
header.top{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;white-space:nowrap}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:900;font-size:13px;letter-spacing:.5px}
.camp{display:flex;align-items:center;gap:10px;flex:1;min-width:220px}
.camp input{background:transparent;border:1px solid transparent;color:var(--text);font:600 15px var(--font);padding:6px 8px;border-radius:8px;flex:1 1 auto;width:auto;max-width:280px;min-width:110px}
.camp .stepper{flex:none}
.camp input:hover{border-color:var(--border)}
.camp input:focus{outline:none;border-color:var(--accent);background:var(--input)}
.stepper{display:flex;align-items:center;border:1px solid var(--border);border-radius:8px;overflow:hidden;white-space:nowrap}
.stepper span{padding:0 10px;font-size:14px}
.stepper button{background:var(--panel2);border:0;color:var(--text);width:30px;height:32px;cursor:pointer;font-size:16px}
.stepper button:hover{background:var(--panel3)}
.hactions{display:flex;gap:8px;flex-wrap:wrap}

/* Layout */
.app{display:grid;grid-template-columns:200px minmax(0,1fr) 340px;gap:18px;padding:18px;max-width:1640px;margin:0 auto;align-items:start}
nav.side{display:flex;flex-direction:column;gap:4px;position:sticky;top:74px}
nav.side button{display:flex;align-items:center;gap:10px;background:transparent;border:1px solid transparent;color:var(--muted);font:600 14px var(--font);padding:10px 12px;border-radius:9px;cursor:pointer;text-align:left}
nav.side button:hover{background:var(--panel2);color:var(--text)}
nav.side button.active{background:var(--accent-soft);color:var(--text);border-color:var(--border)}
nav.side button.active svg{color:var(--accent)}
html[data-theme="clean"] nav.side button.active{background:var(--text);color:#fff;border-color:var(--text)}
html[data-theme="clean"] nav.side button.active svg{color:#fff}
nav.side button kbd{margin-left:auto}
nav.side .navnote{margin-top:14px;padding:10px 12px;font-size:12px;color:var(--muted);border-top:1px solid var(--border)}
main{min-width:0;display:flex;flex-direction:column;gap:14px}
aside{display:flex;flex-direction:column;gap:14px;position:sticky;top:74px;max-height:calc(100vh - 92px);overflow:auto;padding-bottom:4px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card-title{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-title h2{flex:1}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.gap{gap:10px}
.mt{margin-top:12px}
.grow{flex:1;min-width:0}
.spacer{flex:1}

/* Forms */
input,select,textarea{font:inherit;color:var(--text);background:var(--input);border:1px solid var(--border);border-radius:8px;padding:8px 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
textarea{width:100%;resize:vertical;min-height:70px;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
label.f input,label.f select{text-transform:none;letter-spacing:0;font-weight:400;font-size:15px}
.w70{width:76px}.w90{width:150px}.w80{width:84px}
.inrow{display:flex;gap:4px}
.inrow input{width:100%}
label.chk{display:flex;align-items:center;gap:7px;font-size:14px;cursor:pointer;user-select:none}
label.chk input{width:16px;height:16px;accent-color:var(--accent)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font:600 14px var(--font);padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,transform .05s}
.btn:hover{background:var(--panel3)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-h);border-color:var(--accent-h)}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--panel2)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}
.btn.big{padding:11px 20px;font-size:15px}
.btn:focus-visible,.icon-btn:focus-visible,nav.side button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon-btn{background:transparent;border:1px solid transparent;color:var(--muted);width:32px;height:32px;border-radius:8px;cursor:pointer;display:inline-grid;place-items:center;font-size:14px}
.icon-btn:hover{background:var(--panel2);color:var(--text);border-color:var(--border)}
.icon-btn.danger:hover{color:var(--danger)}

/* Empty states */
.empty{text-align:center;padding:30px 16px;color:var(--muted);border:1px dashed var(--border);border-radius:var(--radius)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}

/* Combat */
.addrow{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.addrow .grow{flex:1;min-width:150px}
.cbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.round{font-size:15px;color:var(--muted)}
.round b{font-size:22px;color:var(--text);margin-left:4px}
.clist{display:flex;flex-direction:column;gap:8px}
.crow{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;transition:border-color .15s,background .15s}
.crow.current{border-color:var(--accent);background:linear-gradient(90deg,var(--accent-soft),transparent 60%);box-shadow:inset 4px 0 0 var(--accent)}
.crow.down{opacity:.5}
.crow.down .nm{text-decoration:line-through}
.ini input{width:64px;text-align:center;font-size:18px;font-weight:700;padding:8px 4px}
.ini input.need{border-color:var(--warn);box-shadow:0 0 0 3px rgba(227,163,58,.18)}
.ini small{display:block;text-align:center;font-size:11px;color:var(--muted);margin-top:3px}
.cname{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nm{font-weight:700;font-size:16px}
.turnmark{background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:5px}
.tag-sc{font-size:11px;font-weight:700;border:1px solid var(--border);color:var(--muted);padding:1px 6px;border-radius:5px}
.def{font-size:13px;color:var(--muted)}
.hp{display:flex;align-items:center;gap:10px;margin-top:7px}
.hpbar{flex:1;max-width:260px;height:8px;background:var(--panel3);border-radius:6px;overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--ok);border-radius:6px;transition:width .25s}
.hpbar i.mid{background:var(--warn)}
.hpbar i.low{background:var(--danger)}
.hpnum{font-size:13px;color:var(--muted);white-space:nowrap}
.hpnum b{color:var(--text);font-size:15px}
.conds{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:3px 4px 3px 10px}
.chip b{background:var(--accent);color:var(--on-accent);border-radius:10px;padding:0 6px;font-size:11px}
.chip button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:11px;padding:0 4px;border-radius:10px}
.chip button:hover{color:var(--danger)}
.chip.add{padding:3px 10px;cursor:pointer;color:var(--muted);border-style:dashed;background:transparent;font:600 12px var(--font)}
.chip.add:hover{color:var(--text);border-color:var(--accent)}
.condform{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.condform input{padding:6px 8px;font-size:13px}
.condform input[name=cname]{width:190px}
.condform input[name=crounds]{width:150px}
.cact{display:flex;align-items:center;gap:6px}
.cact .amt{width:70px;text-align:center;padding:6px}
.btn.dmg{color:var(--danger)}
.btn.heal{color:var(--ok)}
.combat-hint{font-size:12px;color:var(--muted);margin-top:8px}

/* NPC */
.npc-card{margin-top:14px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.npc-head{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--panel2);border-bottom:1px solid var(--border)}
.npc-head .nname{font-size:22px;font-weight:800;flex:1}
.npc-field{display:grid;grid-template-columns:120px minmax(0,1fr) 34px;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border)}
.npc-field:last-of-type{border-bottom:0}
.npc-field .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.npc-foot{display:flex;gap:8px;padding:12px 16px;background:var(--panel2);border-top:1px solid var(--border);flex-wrap:wrap}
.npc-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.npc-item{border:1px solid var(--border);border-radius:var(--radius);padding:12px;background:var(--panel2);display:flex;flex-direction:column;gap:6px}
.npc-item .top{display:flex;align-items:flex-start;gap:6px}
.npc-item .top div{flex:1}
.npc-item .nm{font-size:15px}
.npc-item .meta{font-size:12px;color:var(--muted)}
.npc-item ul{margin:0;padding-left:16px;font-size:13px}
.npc-item textarea{min-height:38px;font-size:13px;padding:6px 8px}

/* Log */
.loglist{display:flex;flex-direction:column;gap:2px}
.sess-h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:14px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.sess-h:first-child{margin-top:0}
.lentry{display:grid;grid-template-columns:52px 22px minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px 6px;border-radius:8px}
.lentry:hover{background:var(--panel2)}
.lentry .time{font-size:12px;color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}
.lentry .txt{word-wrap:break-word}
.lentry.done .txt{color:var(--muted);text-decoration:line-through}
.lentry .acts{display:flex;gap:2px;opacity:0;transition:opacity .1s}
.lentry:hover .acts,.lentry:focus-within .acts{opacity:1}
.lentry input[type=checkbox]{width:16px;height:16px;margin-top:3px;accent-color:var(--accent)}
button.tag{font:600 13px var(--font);border:0;background:var(--accent-soft);border-radius:5px;padding:0 5px;cursor:pointer}
button.tag.tp{color:var(--tag-p)}
button.tag.to{color:var(--tag-o)}
button.tag.tf{color:var(--tag-f);text-decoration:underline}
html[data-theme="clean"] button.tag{border:1px solid var(--border);background:var(--panel2)}
.filters input[type=search]{flex:1;min-width:160px}
.activefilter{display:inline-flex;align-items:center;gap:6px;font-size:13px;background:var(--accent-soft);border:1px solid var(--border);border-radius:20px;padding:3px 4px 3px 10px}
.hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.7}

/* Tables */
.tables{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px;align-items:start}
.tlist{display:flex;flex-direction:column;gap:3px}
.tlist button.t{display:flex;align-items:center;gap:8px;text-align:left;background:transparent;border:1px solid transparent;color:var(--text);font:500 14px var(--font);padding:9px 10px;border-radius:8px;cursor:pointer}
.tlist button.t:hover{background:var(--panel2)}
.tlist button.t.active{background:var(--accent-soft);border-color:var(--border);font-weight:700}
.tlist button.t span{flex:1}
.tlist .cnt{font-size:12px;color:var(--muted)}
.result{margin:14px 0;padding:18px;border-radius:var(--radius);border:1px solid var(--accent);background:var(--accent-soft);font-size:18px;font-weight:600;display:flex;align-items:center;gap:12px}
.result span{flex:1}
.entries{margin:0;padding-left:30px;columns:2;column-gap:30px;font-size:14px}
.entries li{break-inside:avoid;padding:3px 0;color:var(--muted)}
.entries li span{color:var(--text)}
.entries li.hit span{color:var(--accent);font-weight:700}
html[data-theme="clean"] .entries li.hit span{text-decoration:underline}

/* Aside: Dice */
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dgrid .btn{padding:9px 0}
.dresult{display:flex;align-items:center;gap:14px;margin:12px 0 4px;min-height:58px}
.dresult .num{font-size:42px;font-weight:900;line-height:1;min-width:58px;text-align:center;font-variant-numeric:tabular-nums}
.dresult .num.crit{color:var(--accent)}
.dresult .num.fumble{color:var(--muted)}
.dresult .det{font-size:13px;color:var(--muted);line-height:1.4}
.dresult .det b{color:var(--text)}
.dhist{list-style:none;margin:8px 0 0;padding:0;max-height:180px;overflow:auto;font-size:13px}
.dhist li{display:flex;gap:8px;padding:4px 2px;border-top:1px solid var(--border)}
.dhist li .e{color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dhist li b{font-variant-numeric:tabular-nums}
@keyframes pop{0%{transform:scale(.6);opacity:.2}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .28s ease-out}
.qnotes{list-style:none;margin:10px 0 0;padding:0;font-size:13px}
.qnotes li{padding:5px 0;border-top:1px solid var(--border);display:flex;gap:8px}
.qnotes li .time{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.pinned ol{margin:0;padding-left:22px;font-size:13px;max-height:200px;overflow:auto}
.pinned ol li{padding:2px 0}

/* Modal + Toast */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:100;padding:16px;animation:fade .12s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto}
.modal .mh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border)}
.modal .mh h2{flex:1;font-size:18px}
.modal .mb{padding:18px}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--border)}
.modal ul.tips{padding-left:18px;margin:10px 0;line-height:1.7}
.modal table{width:100%;border-collapse:collapse;font-size:14px}
.modal td{padding:6px 4px;border-bottom:1px solid var(--border)}
.modal td:first-child{width:110px}
.party-row{display:grid;grid-template-columns:1fr 80px 80px 34px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)}
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;align-items:center;pointer-events:none}
.toast{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:var(--shadow);animation:fade .15s;max-width:90vw}
.toast.warn{background:var(--accent);color:var(--on-accent)}
footer{text-align:center;font-size:12px;color:var(--muted);padding:6px 18px 24px}

/* Regelsysteme */
.w100{width:120px}
#systemSel{font:600 14px var(--font);padding:6px 10px;max-width:230px;flex:none}
.sysline{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--border);color:var(--text);font:600 13px var(--font);padding:6px 12px;border-radius:20px;cursor:pointer}
.sysline:hover{border-color:var(--accent)}
.sysline svg{color:var(--accent)}
.syspick{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin:14px 0 6px}
.syspick button{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);cursor:pointer;font:inherit}
.syspick button span{font-size:12px;color:var(--muted)}
.syspick button:hover{border-color:var(--accent)}
.syspick button.on{border-color:var(--accent);background:var(--accent-soft)}
.modal.wide{width:min(760px,100%)}
.spgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dmsg{font-weight:800;color:var(--accent)}
.dmsg.fumble{color:var(--danger)}
.hpbar.r2 i{background:var(--r2)}
.btn.r2b{color:var(--r2)}
.cact .cbtns{display:flex;flex-wrap:wrap;gap:6px;max-width:250px;justify-content:flex-end}
.costf input{width:70px}
.party-row{grid-template-columns:1fr auto 34px !important}

/* NSC-Erweiterung */
.npcopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.npcopts select{width:100%}
div.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{background:var(--panel2);border:0;border-right:1px solid var(--border);color:var(--text);font:600 14px var(--font);padding:9px 16px;cursor:pointer;text-transform:none;letter-spacing:0}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--panel3)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.seg button.on.pos{background:var(--ok);color:#fff}
.seg button.on.neg{background:var(--danger);color:#fff}
.seg button.on.neu{background:var(--muted);color:var(--bg)}
.seg.sm button{padding:5px 11px;font-size:12px}
.attb{display:inline-block;vertical-align:middle;font-size:11px;font-weight:800;padding:1px 8px;border-radius:20px;border:1px solid currentColor;white-space:nowrap;margin-left:4px}

/* ================= Würfel ================= */
function rollExpr(raw) {
  const s = String(raw).toLowerCase().replace(/\s+/g, '').replace(/w/g, 'd');
  if (!s || !/^[+-]?(\d*d\d+|\d+)([+-](\d*d\d+|\d+))*$/.test(s)) return null;
  const tokens = s.match(/[+-]?(\d*d\d+|\d+)/g);
  let total = 0; const parts = [], groups = [];
  for (const t of tokens) {
    const sign = t[0] === '-' ? -1 : 1;
    const body = t.replace(/^[+-]/, '');
    if (body.includes('d')) {
      let [n, f] = body.split('d');
      n = n === '' ? 1 : +n; f = +f;
      if (n < 1 || n > 100 || f < 2 || f > 1000) return null;
      const rolls = Array.from({length: n}, () => rnd(f) + 1);
      total += sign * rolls.reduce((a, b) => a + b, 0);
      groups.push({n, f, rolls});
      parts.push(`${sign < 0 ? '− ' : parts.length ? '+ ' : ''}${n}W${f} [${rolls.join(', ')}]`);
    } else {
      total += sign * +body;
      parts.push(`${sign < 0 ? '− ' : '+ '}${body}`);
    }
  }
  const r = {expr: s.replace(/d/g, 'W').replace(/^\+/, ''), total, detail: parts.join(' '), crit: null, msg: ''};
  evalCrit(r, groups);
  return r;
}
function evalCrit(r, groups) {
  if (groups.length !== 1) return;
  const g = groups[0], mode = P().crit;
  const count = v => g.rolls.filter(x => x === v).length;
  if (mode === 'd20' && g.n === 1 && g.f === 20) {
    if (g.rolls[0] === 20) { r.crit = 'crit'; r.msg = 'Natürliche 20!'; }
    else if (g.rolls[0] === 1) { r.crit = 'fumble'; r.msg = 'Natürliche 1!'; }
  }
  if (mode === 'dsa' && g.f === 20) {
    if (g.n === 1 && g.rolls[0] === 1) { r.crit = 'crit'; r.msg = 'Eine 1: möglicher kritischer Erfolg, Bestätigungswurf!'; }
    if (g.n === 1 && g.rolls[0] === 20) { r.crit = 'fumble'; r.msg = 'Eine 20: möglicher Patzer, Bestätigungswurf!'; }
    if (g.n === 3 && count(1) >= 2) { r.crit = 'crit'; r.msg = count(1) === 3 ? 'Dreifach-1: kritischer Erfolg!' : 'Doppel-1: kritischer Erfolg!'; }
    if (g.n === 3 && count(20) >= 2) { r.crit = 'fumble'; r.msg = count(20) === 3 ? 'Dreifach-20: Patzer!' : 'Doppel-20: Patzer!'; }
  }
  if (mode === 'coc' && g.n === 1 && g.f === 100) cocMsg(r, g.rolls[0]);
}
function cocMsg(r, v) {
  if (v === 1) { r.crit = 'crit'; r.msg = '01: kritischer Erfolg!'; }
  else if (v === 100) { r.crit = 'fumble'; r.msg = '100: Patzer!'; }
  else if (v >= 96) { r.crit = 'fumble'; r.msg = 'Patzer, falls der Fertigkeitswert unter 50 liegt.'; }
}
function rollAdv(mode) {
  const a = rnd(20) + 1, b = rnd(20) + 1;
  const v = mode === 'adv' ? Math.max(a, b) : Math.min(a, b);
  const r = {expr: mode === 'adv' ? '2W20, höherer' : '2W20, niedrigerer', total: v, detail: `[${a}, ${b}]`, crit: null, msg: ''};
  evalCrit(r, [{n: 1, f: 20, rolls: [v]}]);
  return r;
}
function rollCoc(mode) {
  const units = rnd(10), t1 = rnd(10), t2 = rnd(10);
  const val = t => (t * 10 + units) || 100;

}

function maxOf(expr) {
  const t = String(expr).toLowerCase().replace(/\s+/g, '').replace(/w/g, 'd').match(/[+-]?(\d*d\d+|\d+)/g) || [];

    return m + sg * +b;
  }, 0);
}
const doubleDice = expr => String(expr).replace(/(\d*)\s*[wWdD]\s*(\d+)/g, (m, n, f) => `${(n === '' ? 1 : +n) * 2}W${f}`);
function rollWeapon(w, bonus, crit) {
  const bs = String(bonus || '').trim();
  const b = bs ? rollExpr(bs) : null;
  if (bs && !b) return null;
  const bt = b ? b.total : 0, bd = b ? ` + Bonus ${b.detail.replace(/^\+\s*/, '')}` : '';
  const base = rollExpr(w.dmg); if (!base) return null;
  if (!crit || w.crit === 'none') return {total: base.total + bt, detail: base.detail + bd};
  if (w.crit === 'dice2') { const r = rollExpr(doubleDice(w.dmg)); return {total: r.total + bt, detail: `Würfel verdoppelt: ${r.detail}${bd}`}; }
  if (w.crit === 'max') { const m = maxOf(w.dmg); return {total: m + bt, detail: `Maximalschaden ${m}${bd}`}; }
  if (w.crit === 'maxroll') { const m = maxOf(w.dmg); return {total: m + base.total + bt, detail: `Maximum ${m} + Wurf ${base.detail}${bd}`}; }

}

/* ---------- Log ---------- */
const TAG_RE = /(^|\s)([@#!])([0-9A-Za-zÄÖÜäöüßÀ-ÿ_\-]+)/g;
const isOpenThread = t => /(^|\s)![0-9A-Za-zÄÖÜäöüßÀ-ÿ_\-]+/.test(t);
function addLog(text) {
  S.log.push({id: uid(), session: S.session, time: nowTime(), ts: Date.now(), text, done: false});
  save();
}
function fmtLog(t) {
  return esc(t).replace(TAG_RE, (m, pre, sym, w) => `${pre}<button class="tag ${sym === '@' ? 'tp' : sym === '#' ? 'to' : 'tf'}" data-act="filterTag" data-tag="${esc(sym + w)}" title="Nach ${esc(sym + w)} filtern">${sym}${esc(w.replace(/_/g, ' '))}</button>`);
}
function viewLog() {
  const sessions = [...new Set([S.session, ...S.log.map(e => e.session)])].sort((a, b) => b - a);
  return `
  <div class="view-head"><div><h1>Sitzungs-Log</h1><p class="muted">Kurz notieren, was passiert. Enter speichert mit Uhrzeit.</p></div></div>
  <div class="card">
    <form id="logForm" class="row gap" autocomplete="off"><input name="text" class="grow" id="logInput" placeholder="Was ist passiert? z. B. @Alrik verrät #Burg_Falkenstein !Schatzkarte" maxlength="500"><button class="btn primary">Speichern</button></form>
    <div class="hint"><code>@Name</code> markiert eine Person · <code>#Ort</code> einen Ort · <code>!Stichwort</code> einen offenen Handlungsfaden. Leerzeichen im Namen als Unterstrich: <code>@Alrik_Eichhorn</code>. Ein Klick auf eine Markierung filtert danach.</div>
  </div>
  <div class="card">
    <div class="row wrap gap filters">
      <select data-change="logSession" aria-label="Sitzung"><option value="all">Alle Sitzungen</option>${sessions.map(s => `<option value="${s}" ${String(ui.logSession) === String(s) ? 'selected' : ''}>Sitzung ${s}</option>`).join('')}</select>
      <input type="search" id="logSearch" placeholder="Im Log suchen…" value="${esc(ui.logSearch)}">
      <label class="chk"><input type="checkbox" data-change="logOpen" ${ui.logOpen ? 'checked' : ''}> Nur offene Fäden</label>
      ${ui.logTag ? `<span class="activefilter">Filter: <b>${esc(ui.logTag.replace(/_/g, ' '))}</b><button class="icon-btn" style="width:24px;height:24px" data-act="clearTag" aria-label="Filter entfernen">✕</button></span>` : ''}
    </div>
    <div id="logList" class="mt"></div>
  </div>`;
}
function renderLogList() {
  const box = $('#logList'); if (!box) return;
  const q = ui.logSearch.trim().toLowerCase();
  const tagRe = ui.logTag ? new RegExp('(^|\\s)' + ui.logTag.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![0-9A-Za-zÄÖÜäöüßÀ-ÿ_\\-])', 'i') : null;
  const list = S.log.filter(e => (ui.logSession === 'all' || String(e.session) === String(ui.logSession))
    && (!q || e.text.toLowerCase().includes(q))
    && (!ui.logOpen || (isOpenThread(e.text) && !e.done))
    && (!tagRe || tagRe.test(e.text)));
  if (!S.log.length) { box.innerHTML = '<div class="empty"><b>Das Log ist noch leer</b>Notiere oben, was in der Sitzung passiert. Beendete Kämpfe und übernommene NSCs landen automatisch hier.</div>'; return; }
  if (!list.length) { box.innerHTML = '<p class="muted">Keine Einträge für diesen Filter.</p>'; return; }
  const groups = {};
  list.forEach(e => (groups[e.session] = groups[e.session] || []).push(e));
  box.innerHTML = Object.keys(groups).map(Number).sort((a, b) => b - a).map(s =>
    `<div class="sess-h">Sitzung ${s}</div><div class="loglist">${groups[s].slice().reverse().map(logRow).join('')}</div>`).join('');
}
function logRow(e) {
  const open = isOpenThread(e.text);
  if (ui.editLog === e.id) return `<form class="logEdit row gap" data-id="${e.id}" style="padding:6px 0"><input name="text" class="grow" value="${esc(e.text)}" maxlength="500"><button class="btn sm primary">Speichern</button><button type="button" class="btn sm ghost" data-act="cancelEdit">Abbrechen</button></form>`;
  return `<div class="lentry ${open && e.done ? 'done' : ''}">
    <span class="time">${esc(e.time)}</span>
    <span>${open ? `<input type="checkbox" data-change="logDone" data-id="${e.id}" ${e.done ? 'checked' : ''} title="Faden erledigt" aria-label="Faden erledigt">` : ''}</span>

/* ---------- Tabellen ---------- */
const sysTable = () => ({id: 'sys', name: `Zustände (${P().short})`, entries: P().conds, readonly: true});
const allTables = () => [sysTable(), ...S.tables];
function parseEntries(t) {
  return t.entries.map(line => { const m = String(line).match(/^(\d+)\s*[x×]\s+(.+)$/i); return m ? {w: Math.max(1, +m[1]), text: m[2]} : {w: 1, text: String(line)}; }).filter(e => e.text.trim());
}
function rollTable(t) {
  const es = parseEntries(t); if (!es.length) return null;
  const tot = es.reduce((a, e) => a + e.w, 0);
  let r = rnd(tot);
  for (const e of es) { if (r < e.w) return e.text; r -= e.w; }
  return es[es.length - 1].text;
}
function currentTable() {
  const all = allTables();
  let t = all.find(x => x.id === ui.tableSel);
  if (!t) { t = all[1] || all[0]; ui.tableSel = t.id; }
  return t;
}
function viewTables() {
  const t = currentTable();
  const list = allTables().map(x => `<button class="t ${x.id === t.id ? 'active' : ''}" data-act="selTable" data-id="${x.id}"><span>${esc(x.name)}</span>${S.pinned === x.id ? icon('pin') : ''}<span class="cnt">${parseEntries(x).length}</span></button>`).join('');
  let body;
  if (ui.tableEdit && !t.readonly) body = `<form id="tableEdit" autocomplete="off">
      <label class="f">Name der Tabelle<input name="name" value="${esc(t.name)}" required maxlength="50"></label>
      <label class="f mt">Einträge, einer pro Zeile<textarea name="entries" rows="14">${esc(t.entries.join('\n'))}</textarea></label>
      <p class="hint">Tipp: <code>3x Ein Eintrag</code> macht einen Eintrag dreimal so wahrscheinlich.</p>
      <div class="row gap mt"><button class="btn primary">Speichern</button><button type="button" class="btn ghost" data-act="cancelTable">Abbrechen</button></div></form>`;
  else {
    const es = parseEntries(t);
    body = `<div class="row wrap gap"><h2 class="grow" style="font-size:20px">${esc(t.name)}</h2>
        <button class="btn sm ghost" data-act="pinTable" title="Als Spickzettel in der rechten Spalte anzeigen">${icon('pin')} ${S.pinned === t.id ? 'Lösen' : 'Anheften'}</button>
        ${t.readonly ? '' : `<button class="btn sm ghost" data-act="editTable">${icon('note')} Bearbeiten</button><button class="btn sm ghost danger" data-act="rmTable">Löschen</button>`}</div>
      ${t.readonly ? `<p class="hint">Passt sich automatisch an das gewählte Regelsystem an. Die Regeln zu den Zuständen stehen in deinem Regelwerk.</p>` : ''}
      <div class="row gap mt"><button class="btn primary big" data-act="rollTable" ${es.length ? '' : 'disabled'}>${icon('dice')} Würfeln</button><span class="muted small">${es.length} Einträge</span></div>
      ${ui.tableResult && ui.tableResult.id === t.id ? `<div class="result pop"><span>${esc(ui.tableResult.text)}</span><button class="btn sm" data-act="tableToLog" title="Ergebnis ins Sitzungs-Log schreiben">Ins Log</button></div>` : ''}
      <ol class="entries mt">${es.map(e => `<li class="${ui.tableResult && ui.tableResult.id === t.id && ui.tableResult.text === e.text ? 'hit' : ''}"><span>${esc(e.text)}</span>${e.w > 1 ? ` <small>(×${e.w})</small>` : ''}</li>`).join('')}</ol>`;
  }
  return `
  <div class="view-head"><div><h1>Tabellen</h1><p class="muted">Zufallstabellen und Spickzettel. Eigene Listen in Sekunden anlegen.</p></div></div>
  <div class="tables">
    <div class="card"><div class="tlist">${list}</div><button class="btn sm mt" style="width:100%" data-act="newTable">+ Neue Tabelle</button></div>
    <div class="card">${body}</div>
  </div>`;
}

  clearCombat: () => confirmBox('Alle Teilnehmer aus der Liste entfernen?', 'Liste leeren', () => { S.combat = Object.assign(emptyCombat(), {lastCost: S.combat.lastCost}); save(); renderMain(); }),
  dmg: b => changeVal(b.dataset.id, 'hp', -1),

  removeC: b => {
    const c = S.combat, L = sortedCombat();
    if (c.currentId === b.dataset.id) {
      const i = L.findIndex(x => x.id === b.dataset.id);
      const rest = L.slice(i + 1).concat(L.slice(0, i)).filter(alive);

    const n = S.npcs.find(x => x.id === b.dataset.id); if (!n) return;
    const o = nextOrder(), p = P();
    S.combat.list.push({id: uid(), name: n.name, init: p.ini.expr ? rollInit(0) : null, iniBonus: null, iniDice: null, hp: null, maxHp: null, r2: null, r2Max: null, def: null, pc: false, conds: [], order: o, seq: o});
    if (S.combat.active && isTick()) pickLowest();
    save(); toast(`${n.name} ist im Kampf${p.ini.expr ? ' (gewürfelt, Wert ohne Bonus)' : ''}`);
  },
  // Log
  filterTag: b => { ui.logTag = b.dataset.tag; if (S.view !== 'log') { S.view = 'log'; save(); render(); } else renderMain(); },
  clearTag: () => { ui.logTag = null; renderMain(); },
  editLog: b => { ui.editLog = b.dataset.id; renderLogList(); const i = document.querySelector('.logEdit input'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } },
  cancelEdit: () => { ui.editLog = null; renderLogList(); },
  rmLog: b => { S.log = S.log.filter(e => e.id !== b.dataset.id); save(); renderLogList(); renderAside(); },
  // Tabellen
  selTable: b => { ui.tableSel = b.dataset.id; ui.tableEdit = false; renderMain(); },
  rollTable: () => { const t = currentTable(); const r = rollTable(t); if (r != null) { ui.tableResult = {id: t.id, text: r}; renderMain(); renderAside(); } },
  rollPinned: () => { const t = allTables().find(x => x.id === S.pinned); if (!t) return; const r = rollTable(t); if (r != null) { ui.tableResult = {id: t.id, text: r}; renderAside(); if (S.view === 'tables') renderMain(); } },
  tableToLog: () => { const t = currentTable(); if (!ui.tableResult) return; addLog(`${t.name}: ${ui.tableResult.text}`); renderAside(); toast('Ins Log geschrieben'); },
  pinTable: () => { const t = currentTable(); S.pinned = S.pinned === t.id ? null : t.id; save(); renderMain(); renderAside(); },
  editTable: () => { ui.tableEdit = true; renderMain(); },
  cancelTable: () => { ui.tableEdit = false; renderMain(); },
  newTable: () => { const t = {id: uid(), name: 'Neue Tabelle', entries: []}; S.tables.push(t); ui.tableSel = t.id; ui.tableEdit = true; save(); renderMain(); const i = $('#tableEdit input[name=name]'); if (i) { i.focus(); i.select(); } },
  rmTable: () => { const t = currentTable(); if (t.readonly) return; confirmBox(`Tabelle „${t.name}“ löschen?`, 'Löschen', () => { S.tables = S.tables.filter(x => x.id !== t.id); if (S.pinned === t.id) S.pinned = null; ui.tableSel = null; save(); renderMain(); renderAside(); }); },
  // Würfel
  quickDie: b => doRoll(rollExpr(b.dataset.e)),
  adv: () => doRoll(rollAdv('adv')),
  dis: () => doRoll(rollAdv('dis')),
  cocBonus: () => doRoll(rollCoc('bonus')),
  cocMalus: () => doRoll(rollCoc('malus')),
  smSafe: () => doRoll(rollSm('safe')),
  smRisk: () => doRoll(rollSm('risk')),
  clearDice: () => { S.dice = []; ui.lastRoll = null; save(); renderAside(); },
  resetAll: () => confirmBox('Wirklich ALLE Daten löschen? Das kann nicht rückgängig gemacht werden. Sichere vorher, wenn du unsicher bist.', 'Alles löschen', () => { S = defaultState(); S.seenWelcome = true; S.seenSystem = true; save(); Object.assign(ui, {draft: null, condFor: null, logTag: null, tableSel: null, tableResult: null, lastRoll: null}); render(); toast('Alle Daten gelöscht'); })
};
const changes = {
  system: el => setSystem(el.value),
  setWeapon: el => { const x = findC(el.dataset.id); if (x) { x.weapon = el.value || null; if (ui.attack && ui.attack.by === x.id) ui.attack = null; save(); renderMain(); } },
  setDmgBonus: el => { const x = findC(el.dataset.id); if (x) { x.dmgBonus = el.value.trim(); save(); } },
  setInit: el => { const x = findC(el.dataset.id); if (x) { x.init = num(el.value); if (S.combat.active && isTick()) pickLowest(); save(); renderMain(); } },
  npcCulture: el => { S.npcPrefs.culture = el.value; save(); },
  npcGender: el => { S.npcPrefs.gender = el.value; save(); },
  npcAge: el => { S.npcPrefs.age = el.value; save(); },
  npcRole: el => { S.npcPrefs.role = el.value; save(); },
  npcFilterAtt: el => { ui.npcAtt = el.value; renderNpcList(); },
  npcAtt: el => { const n = S.npcs.find(x => x.id === el.dataset.id); if (n && ATT[el.value]) { n.att = el.value; n.behavior = pick(ATT[el.value].lines); save(); renderNpcList(); toast(`${n.name} ist jetzt ${ATT[el.value].log}`); } },
  npcNote: el => { const n = S.npcs.find(x => x.id === el.dataset.id); if (n) { n.notes = el.value; save(); } },
  logSession: el => { ui.logSession = el.value; renderLogList(); },
  logOpen: el => { ui.logOpen = el.checked; renderLogList(); },
  logDone: el => { const e = S.log.find(x => x.id === el.dataset.id); if (e) { e.done = el.checked; save(); renderLogList(); } }
};

/* ================= Formulare ================= */
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.id === 'addForm') addCombatant(f);
  else if (f.classList.contains('condform')) {
    const x = findC(f.dataset.id); const fd = new FormData(f);
    const name = String(fd.get('cname') || '').trim();
    if (x && name) { x.conds.push({name, rounds: num(fd.get('crounds'))}); ui.condFor = null; save(); renderMain(); }
  }
  else if (f.id === 'partyForm') {
    const fd = new FormData(f); const name = String(fd.get('name') || '').trim(); if (!name) return;
    S.party.push({id: uid(), name, ini: num(fd.get('ini')), iniDice: num(fd.get('inidice')), hp: num(fd.get('hp')), r2: num(fd.get('r2')), def: num(fd.get('def')), weapon: String(fd.get('weapon') || '') || null, dmgBonus: String(fd.get('dmgBonus') || '').trim()});
    save(); manageParty(); renderMain();
    const i = $('#partyForm input[name=name]'); if (i) i.focus();
  }
  else if (f.id === 'logForm' || f.id === 'quickNote') {
    const inp = f.querySelector('input[name=text]'); const t = inp.value.trim(); if (!t) return;
    addLog(t); inp.value = '';
    if (S.view === 'log') renderLogList();
    renderAside();
    if (f.id === 'quickNote') { toast('Notiz gespeichert'); const q = $('#quickNote input'); if (q) q.focus(); }
  }
  else if (f.classList.contains('logEdit')) {
    const e2 = S.log.find(x => x.id === f.dataset.id); const t = f.querySelector('input').value.trim();
    if (e2 && t) { e2.text = t; save(); }
    ui.editLog = null; renderLogList(); renderAside();
  }
  else if (f.id === 'weaponForm') {
    const fd = new FormData(f); const name = String(fd.get('name') || '').trim(); const dmg = String(fd.get('dmg') || '').trim();
    if (!name || !dmg) return;
    if (!rollExpr(dmg)) { toast('Ungültiger Schaden. Beispiele: 1W8, 2W6+3, 4', 'warn'); return; }
    S.weapons.push({id: uid(), sys: S.system, name, dmg: dmg.replace(/d/gi, 'W'), crit: S.system === 'sr6' ? 'none' : (String(fd.get('crit') || W().def)), threat: num(fd.get('threat')), type: S.system === 'sr6' ? String(fd.get('type') || 'K') : null});
    save(); manageWeapons(); renderMain(); toast(`${name} angelegt`);
    const i = $('#weaponForm input[name=name]'); if (i) i.focus();
  }
  else if (f.id === 'diceForm') { const v = f.querySelector('input').value; doRoll(rollExpr(v)); const i = $('#diceForm input'); if (i) i.value = v; }
  else if (f.id === 'poolForm') { const n = num(f.querySelector('input').value) || 1; S.poolSize = n; doRoll(rollPool(n)); }
  else if (f.id === 'tableEdit') {
    const t = currentTable(); if (t.readonly) return; const fd = new FormData(f);
    t.name = String(fd.get('name') || '').trim() || 'Ohne Namen';
    t.entries = String(fd.get('entries') || '').split('\n').map(s => s.trim()).filter(Boolean);
    ui.tableEdit = false; ui.tableResult = null; save(); renderMain(); renderAside(); toast('Tabelle gespeichert');
  }
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const fn = actions[b.dataset.act]; if (fn) { e.preventDefault(); fn(b, e); }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]'); if (!el) return;
  const fn = changes[el.dataset.change]; if (fn) fn(el);
});
document.addEventListener('input', e => {
  if (e.target.id === 'npcSearch') { ui.npcSearch = e.target.value; renderNpcList(); }
  if (e.target.id === 'logSearch') { ui.logSearch = e.target.value; renderLogList(); }
  if (e.target.id === 'campaign') { S.campaign = e.target.value; save(); }
  if (e.target.id === 'tickCost') { const v = num(e.target.value); if (v) { S.combat.lastCost = v; save(); } }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.classList && t.classList.contains('amt') && e.key === 'Enter') { e.preventDefault(); changeVal(t.dataset.id, 'hp', e.shiftKey ? 1 : -1); return; }
  if (t.id === 'tickCost' && e.key === 'Enter') { e.preventDefault(); nextTurn(); return; }
  if (t.matches && t.matches('.ini input') && e.key === 'Enter') { t.blur(); return; }
  if (e.key === 'Escape') { if ($('#overlay')) closeModal(); else if (ui.condFor) { ui.condFor = null; renderMain(); } return; }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable;
  if (typing || e.ctrlKey || e.metaKey || e.altKey || $('#overlay')) return;
  const k = e.key.toLowerCase();
  if (['1','2','3','4'].includes(k)) { S.view = VIEWS[+k - 1][0]; save(); render(); }
  else if (k === 'n' && S.view === 'combat') { e.preventDefault(); S.combat.active ? nextTurn() : startCombat(); }
  else if (k === 'g' && !DEMO) { if (S.view !== 'npc') { S.view = 'npc'; save(); } genNpc(); render(); }
  else if (k === 'w') doRoll(rollExpr('1W20'));
  else if (k === 'l' && !DEMO) { e.preventDefault(); const q = $('#quickNote input'); if (q) q.focus(); }
  else if (e.key === '?') showHelp();
});

/* ================= Sichern / Laden ================= */
function exportText() { return JSON.stringify({app: 'spielleiter-toolkit', version: 2, exported: new Date().toISOString(), state: S}, null, 2); }
function showCopyBox(txt) {
  openModal('Daten kopieren', `<p class="small muted">Markiere den Text (Strg+A) und kopiere ihn (Strg+C). Speichere ihn in einer Textdatei.</p><textarea id="copyBox" rows="10" readonly>${esc(txt)}</textarea>`, '<button class="btn" data-act="closeModal">Fertig</button>');
  const b = $('#copyBox'); if (b) { b.focus(); b.select(); }
}
function exportData() {
  S.lastExport = Date.now(); save();
  const blob = new Blob([exportText()], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `spielleiter-toolkit_${slug(S.campaign)}_${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Sicherungsdatei wird heruntergeladen');
}
$('#importFile').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => importText(reader.result);
  reader.readAsText(file);
  e.target.value = '';
});
function importText(raw) {
  let obj;
  try { obj = JSON.parse(raw); } catch (err) { toast('Die Daten konnten nicht gelesen werden.', 'warn'); return; }
  if (!obj || obj.app !== 'spielleiter-toolkit' || !obj.state) { toast('Das sind keine Daten des Spielleiter-Toolkits.', 'warn'); return; }
  confirmBox(`Kampagne „${obj.state.campaign || 'ohne Namen'}“ laden? Die aktuellen Daten werden ersetzt.`, 'Laden', () => {
    S = normalize(obj.state); S.seenWelcome = true; S.seenSystem = true; save();
    Object.assign(ui, {draft: null, condFor: null, logTag: null, tableSel: null, tableResult: null, lastRoll: null, editLog: null});
    render(); toast('Kampagne geladen');
  });
}

/* ================= Hilfe & Willkommen ================= */
function showWelcome() {
  openModal('Willkommen, Spielleiter!', `<p>Welches Regelsystem spielt ihr? Das Tool passt Begriffe, Initiative, Zustände, Würfel und NSCs daran an. Du kannst es jederzeit oben ändern.</p>${systemGrid()}
    <p class="hint">Das ist die kostenlose Demo mit Kampf-Tracker und Würfeln. Dein System fehlt? Nimm „Allgemein“. Das funktioniert mit allen Systemen mit Initiative und Lebenspunkten.</p>`, '', true);
}
function showHelp() {
  const keys = [['1 – 4','Bereich wechseln'],['N','Nächster Zug bzw. Aktion ausführen'],['G','Neuer NSC'],['W','1W20 würfeln'],['L','Schnellnotiz schreiben'],['Enter','im Schadensfeld: Schaden abziehen'],['Umschalt + Enter','im Schadensfeld: heilen'],['Esc','Fenster schließen'],['?','Diese Hilfe']];
  openModal('Hilfe', `
    <ul class="tips">
      <li><b>Regelsystem:</b> oben in der Leiste wählen. Begriffe, Initiative, Zustände, Würfel und NSCs passen sich an.</li>
      <li><b>Kampf:</b> Gegner eintragen, „Kampf starten“, dann mit <kbd>N</kbd> weiter. Zustände mit Rundenzahl laufen automatisch ab.</li>
      <li><b>NSC-Generator:</b> Ein Klick liefert Name, Beruf, Aussehen, Eigenart und Motiv.</li>
      <li><b>Sitzungs-Log:</b> Notizen mit <code>@Person</code>, <code>#Ort</code> und <code>!Faden</code> markieren und später filtern.</li>
      <li><b>Tabellen:</b> Zufallstabellen würfeln oder als Spickzettel anheften.</li>
      <li><b>Speichern:</b> passiert automatisch in diesem Browser. Mit „Sichern“ erstellst du zusätzlich eine Datei.</li>
    </ul>
    <h2 class="mt" style="margin-bottom:6px">Tastenkürzel</h2>
    <table>${keys.map(([k, d]) => `<tr><td><kbd>${k}</kbd></td><td>${d}</td></tr>`).join('')}</table>
    <div class="mt" style="padding-top:12px;border-top:1px solid var(--border)"><button class="btn sm ghost danger" data-act="resetAll">Alle Daten löschen</button></div>`,
    `<button class="btn primary" data-act="closeModal">Schließen</button>`);
}

/* ================= Start ================= */
render();
if (!S.seenSystem) { S.seenWelcome = true; S.seenSystem = true; save(); showWelcome(); }

</script>
</body>
</html>
