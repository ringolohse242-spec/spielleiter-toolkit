<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Spielleiter-Toolkit Demo: Kampf-Tracker, NSC-Generator, Sitzungs-Log, Würfel und Zufallstabellen für D&amp;D 5e, Pathfinder 2, DSA 5, Cthulhu 7, Shadowrun 6 und Splittermond. Offline, ohne Anmeldung, im Browser.">
<meta property="og:type" content="website">
<meta property="og:title" content="Spielleiter-Toolkit – Demo">
<meta property="og:description" content="Weniger merken, weniger blättern – mehr erzählen. Jede Funktion 3× kostenlos ausprobieren.">
<meta property="og:url" content="https://ringolohse242-spec.github.io/spielleiter-toolkit/">
<meta property="og:image" content="https://ringolohse242-spec.github.io/spielleiter-toolkit/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<title>Spielleiter-Toolkit – Demo</title>
<style>
:root{--radius:10px;--font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html[data-theme="dark"]{--bg:#0c0a0a;--panel:#161212;--panel2:#201919;--panel3:#2a2020;--border:#332828;--text:#f1e9e6;--muted:#a4958f;--accent:#d0182a;--accent-h:#e8303f;--accent-soft:rgba(208,24,42,.16);--on-accent:#fff;--danger:#ff5664;--ok:#45b06f;--warn:#e3a33a;--input:#0f0c0c;--shadow:0 10px 30px rgba(0,0,0,.55);--tag-p:#ff7a85;--tag-o:#e0b25a;--tag-f:#ff5664;--r2:#7fa2ff}
html[data-theme="clean"]{--bg:#ffffff;--panel:#ffffff;--panel2:#f4f4f4;--panel3:#e9e9e9;--border:#dddddd;--text:#111111;--muted:#666666;--accent:#111111;--accent-h:#333333;--accent-soft:rgba(0,0,0,.07);--on-accent:#ffffff;--danger:#b3261e;--ok:#2e7d4f;--warn:#a86a00;--input:#ffffff;--shadow:0 10px 30px rgba(0,0,0,.14);--tag-p:#111;--tag-o:#111;--tag-f:#b3261e;--r2:#555555}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh}
h1{font-size:24px;margin:0 0 2px;letter-spacing:-.2px}
h2{font-size:16px;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
kbd{font:11px/1 var(--font);border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:2px 5px;color:var(--muted);background:var(--panel2)}
.btn.primary kbd{background:transparent;color:inherit;border-color:rgba(255,255,255,.4);opacity:.85}
code{background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:0 4px;font-size:13px}

/* Header */
header.top{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;white-space:nowrap}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:900;font-size:13px;letter-spacing:.5px}
.camp{display:flex;align-items:center;gap:10px;flex:1;min-width:220px}
.camp input{background:transparent;border:1px solid transparent;color:var(--text);font:600 15px var(--font);padding:6px 8px;border-radius:8px;flex:1 1 auto;width:auto;max-width:280px;min-width:110px}
.camp .stepper{flex:none}
.camp input:hover{border-color:var(--border)}
.camp input:focus{outline:none;border-color:var(--accent);background:var(--input)}
.stepper{display:flex;align-items:center;border:1px solid var(--border);border-radius:8px;overflow:hidden;white-space:nowrap}
.stepper span{padding:0 10px;font-size:14px}
.stepper button{background:var(--panel2);border:0;color:var(--text);width:30px;height:32px;cursor:pointer;font-size:16px}
.stepper button:hover{background:var(--panel3)}
.hactions{display:flex;gap:8px;flex-wrap:wrap}

/* Layout */
.app{display:grid;grid-template-columns:200px minmax(0,1fr) 340px;gap:18px;padding:18px;max-width:1640px;margin:0 auto;align-items:start}
nav.side{display:flex;flex-direction:column;gap:4px;position:sticky;top:74px}
nav.side button{display:flex;align-items:center;gap:10px;background:transparent;border:1px solid transparent;color:var(--muted);font:600 14px var(--font);padding:10px 12px;border-radius:9px;cursor:pointer;text-align:left}
nav.side button:hover{background:var(--panel2);color:var(--text)}
nav.side button.active{background:var(--accent-soft);color:var(--text);border-color:var(--border)}
nav.side button.active svg{color:var(--accent)}
html[data-theme="clean"] nav.side button.active{background:var(--text);color:#fff;border-color:var(--text)}
html[data-theme="clean"] nav.side button.active svg{color:#fff}
nav.side button kbd{margin-left:auto}
nav.side .navnote{margin-top:14px;padding:10px 12px;font-size:12px;color:var(--muted);border-top:1px solid var(--border)}
main{min-width:0;display:flex;flex-direction:column;gap:14px}
aside{display:flex;flex-direction:column;gap:14px;position:sticky;top:74px;max-height:calc(100vh - 92px);overflow:auto;padding-bottom:4px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card-title{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-title h2{flex:1}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.gap{gap:10px}
.mt{margin-top:12px}
.grow{flex:1;min-width:0}
.spacer{flex:1}

/* Forms */
input,select,textarea{font:inherit;color:var(--text);background:var(--input);border:1px solid var(--border);border-radius:8px;padding:8px 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
textarea{width:100%;resize:vertical;min-height:70px;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
label.f input,label.f select{text-transform:none;letter-spacing:0;font-weight:400;font-size:15px}
.w70{width:76px}.w90{width:150px}.w80{width:84px}
.inrow{display:flex;gap:4px}
.inrow input{width:100%}
label.chk{display:flex;align-items:center;gap:7px;font-size:14px;cursor:pointer;user-select:none}
label.chk input{width:16px;height:16px;accent-color:var(--accent)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font:600 14px var(--font);padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,transform .05s}
.btn:hover{background:var(--panel3)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-h);border-color:var(--accent-h)}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--panel2)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}
.btn.big{padding:11px 20px;font-size:15px}
.btn:focus-visible,.icon-btn:focus-visible,nav.side button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon-btn{background:transparent;border:1px solid transparent;color:var(--muted);width:32px;height:32px;border-radius:8px;cursor:pointer;display:inline-grid;place-items:center;font-size:14px}
.icon-btn:hover{background:var(--panel2);color:var(--text);border-color:var(--border)}
.icon-btn.danger:hover{color:var(--danger)}

/* Empty states */
.empty{text-align:center;padding:30px 16px;color:var(--muted);border:1px dashed var(--border);border-radius:var(--radius)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}

/* Combat */
.addrow{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.addrow .grow{flex:1;min-width:150px}
.cbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.round{font-size:15px;color:var(--muted)}
.round b{font-size:22px;color:var(--text);margin-left:4px}
.clist{display:flex;flex-direction:column;gap:8px}
.crow{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;transition:border-color .15s,background .15s}
.crow.current{border-color:var(--accent);background:linear-gradient(90deg,var(--accent-soft),transparent 60%);box-shadow:inset 4px 0 0 var(--accent)}
.crow.down{opacity:.5}
.crow.down .nm{text-decoration:line-through}
.ini input{width:64px;text-align:center;font-size:18px;font-weight:700;padding:8px 4px}
.ini input.need{border-color:var(--warn);box-shadow:0 0 0 3px rgba(227,163,58,.18)}
.ini small{display:block;text-align:center;font-size:11px;color:var(--muted);margin-top:3px}
.cname{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nm{font-weight:700;font-size:16px}
.turnmark{background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:5px}
.tag-sc{font-size:11px;font-weight:700;border:1px solid var(--border);color:var(--muted);padding:1px 6px;border-radius:5px}
.def{font-size:13px;color:var(--muted)}
.hp{display:flex;align-items:center;gap:10px;margin-top:7px}
.hpbar{flex:1;max-width:260px;height:8px;background:var(--panel3);border-radius:6px;overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--ok);border-radius:6px;transition:width .25s}
.hpbar i.mid{background:var(--warn)}
.hpbar i.low{background:var(--danger)}
.hpnum{font-size:13px;color:var(--muted);white-space:nowrap}
.hpnum b{color:var(--text);font-size:15px}
.conds{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:3px 4px 3px 10px}
.chip b{background:var(--accent);color:var(--on-accent);border-radius:10px;padding:0 6px;font-size:11px}
.chip button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:11px;padding:0 4px;border-radius:10px}
.chip button:hover{color:var(--danger)}
.chip.add{padding:3px 10px;cursor:pointer;color:var(--muted);border-style:dashed;background:transparent;font:600 12px var(--font)}
.chip.add:hover{color:var(--text);border-color:var(--accent)}
.condform{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.condform input{padding:6px 8px;font-size:13px}
.condform input[name=cname]{width:190px}
.condform input[name=crounds]{width:150px}
.cact{display:flex;align-items:center;gap:6px}
.cact .amt{width:70px;text-align:center;padding:6px}
.btn.dmg{color:var(--danger)}
.btn.heal{color:var(--ok)}
.combat-hint{font-size:12px;color:var(--muted);margin-top:8px}

/* NPC */
.npc-card{margin-top:14px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.npc-head{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--panel2);border-bottom:1px solid var(--border)}
.npc-head .nname{font-size:22px;font-weight:800;flex:1}
.npc-field{display:grid;grid-template-columns:120px minmax(0,1fr) 34px;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border)}
.npc-field:last-of-type{border-bottom:0}
.npc-field .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.npc-foot{display:flex;gap:8px;padding:12px 16px;background:var(--panel2);border-top:1px solid var(--border);flex-wrap:wrap}
.npc-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.npc-item{border:1px solid var(--border);border-radius:var(--radius);padding:12px;background:var(--panel2);display:flex;flex-direction:column;gap:6px}
.npc-item .top{display:flex;align-items:flex-start;gap:6px}
.npc-item .top div{flex:1}
.npc-item .nm{font-size:15px}
.npc-item .meta{font-size:12px;color:var(--muted)}
.npc-item ul{margin:0;padding-left:16px;font-size:13px}
.npc-item textarea{min-height:38px;font-size:13px;padding:6px 8px}

/* Log */
.loglist{display:flex;flex-direction:column;gap:2px}
.sess-h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:14px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.sess-h:first-child{margin-top:0}
.lentry{display:grid;grid-template-columns:52px 22px minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px 6px;border-radius:8px}
.lentry:hover{background:var(--panel2)}
.lentry .time{font-size:12px;color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}
.lentry .txt{word-wrap:break-word}
.lentry.done .txt{color:var(--muted);text-decoration:line-through}
.lentry .acts{display:flex;gap:2px;opacity:0;transition:opacity .1s}
.lentry:hover .acts,.lentry:focus-within .acts{opacity:1}
.lentry input[type=checkbox]{width:16px;height:16px;margin-top:3px;accent-color:var(--accent)}
button.tag{font:600 13px var(--font);border:0;background:var(--accent-soft);border-radius:5px;padding:0 5px;cursor:pointer}
button.tag.tp{color:var(--tag-p)}
button.tag.to{color:var(--tag-o)}
button.tag.tf{color:var(--tag-f);text-decoration:underline}
html[data-theme="clean"] button.tag{border:1px solid var(--border);background:var(--panel2)}
.filters input[type=search]{flex:1;min-width:160px}
.activefilter{display:inline-flex;align-items:center;gap:6px;font-size:13px;background:var(--accent-soft);border:1px solid var(--border);border-radius:20px;padding:3px 4px 3px 10px}
.hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.7}

/* Tables */
.tables{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px;align-items:start}
.tlist{display:flex;flex-direction:column;gap:3px}
.tlist button.t{display:flex;align-items:center;gap:8px;text-align:left;background:transparent;border:1px solid transparent;color:var(--text);font:500 14px var(--font);padding:9px 10px;border-radius:8px;cursor:pointer}
.tlist button.t:hover{background:var(--panel2)}
.tlist button.t.active{background:var(--accent-soft);border-color:var(--border);font-weight:700}
.tlist button.t span{flex:1}
.tlist .cnt{font-size:12px;color:var(--muted)}
.result{margin:14px 0;padding:18px;border-radius:var(--radius);border:1px solid var(--accent);background:var(--accent-soft);font-size:18px;font-weight:600;display:flex;align-items:center;gap:12px}
.result span{flex:1}
.entries{margin:0;padding-left:30px;columns:2;column-gap:30px;font-size:14px}
.entries li{break-inside:avoid;padding:3px 0;color:var(--muted)}
.entries li span{color:var(--text)}
.entries li.hit span{color:var(--accent);font-weight:700}
html[data-theme="clean"] .entries li.hit span{text-decoration:underline}

/* Aside: Dice */
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dgrid .btn{padding:9px 0}
.dresult{display:flex;align-items:center;gap:14px;margin:12px 0 4px;min-height:58px}
.dresult .num{font-size:42px;font-weight:900;line-height:1;min-width:58px;text-align:center;font-variant-numeric:tabular-nums}
.dresult .num.crit{color:var(--accent)}
.dresult .num.fumble{color:var(--muted)}
.dresult .det{font-size:13px;color:var(--muted);line-height:1.4}
.dresult .det b{color:var(--text)}
.dhist{list-style:none;margin:8px 0 0;padding:0;max-height:180px;overflow:auto;font-size:13px}
.dhist li{display:flex;gap:8px;padding:4px 2px;border-top:1px solid var(--border)}
.dhist li .e{color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dhist li b{font-variant-numeric:tabular-nums}
@keyframes pop{0%{transform:scale(.6);opacity:.2}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .28s ease-out}
.qnotes{list-style:none;margin:10px 0 0;padding:0;font-size:13px}
.qnotes li{padding:5px 0;border-top:1px solid var(--border);display:flex;gap:8px}
.qnotes li .time{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.pinned ol{margin:0;padding-left:22px;font-size:13px;max-height:200px;overflow:auto}
.pinned ol li{padding:2px 0}

/* Modal + Toast */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:100;padding:16px;animation:fade .12s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto}
.modal .mh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border)}
.modal .mh h2{flex:1;font-size:18px}
.modal .mb{padding:18px}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--border)}
.modal ul.tips{padding-left:18px;margin:10px 0;line-height:1.7}
.modal table{width:100%;border-collapse:collapse;font-size:14px}
.modal td{padding:6px 4px;border-bottom:1px solid var(--border)}
.modal td:first-child{width:110px}
.party-row{display:grid;grid-template-columns:1fr 80px 80px 34px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)}
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;align-items:center;pointer-events:none}
.toast{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:var(--shadow);animation:fade .15s;max-width:90vw}
.toast.warn{background:var(--accent);color:var(--on-accent)}
footer{text-align:center;font-size:12px;color:var(--muted);padding:6px 18px 24px}

/* Regelsysteme */
.w100{width:120px}
#systemSel{font:600 14px var(--font);padding:6px 10px;max-width:230px;flex:none}
.sysline{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--border);color:var(--text);font:600 13px var(--font);padding:6px 12px;border-radius:20px;cursor:pointer}
.sysline:hover{border-color:var(--accent)}
.sysline svg{color:var(--accent)}
.syspick{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin:14px 0 6px}
.syspick button{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);cursor:pointer;font:inherit}
.syspick button span{font-size:12px;color:var(--muted)}
.syspick button:hover{border-color:var(--accent)}
.syspick button.on{border-color:var(--accent);background:var(--accent-soft)}
.modal.wide{width:min(760px,100%)}
.spgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dmsg{font-weight:800;color:var(--accent)}
.dmsg.fumble{color:var(--danger)}
.hpbar.r2 i{background:var(--r2)}
.btn.r2b{color:var(--r2)}
.cact .cbtns{display:flex;flex-wrap:wrap;gap:6px;max-width:250px;justify-content:flex-end}
.costf input{width:70px}
.party-row{grid-template-columns:1fr auto 34px !important}

/* NSC-Erweiterung */
.npcopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.npcopts select{width:100%}
div.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{background:var(--panel2);border:0;border-right:1px solid var(--border);color:var(--text);font:600 14px var(--font);padding:9px 16px;cursor:pointer;text-transform:none;letter-spacing:0}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--panel3)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.seg button.on.pos{background:var(--ok);color:#fff}
.seg button.on.neg{background:var(--danger);color:#fff}
.seg button.on.neu{background:var(--muted);color:var(--bg)}
.seg.sm button{padding:5px 11px;font-size:12px}
.attb{display:inline-block;vertical-align:middle;font-size:11px;font-weight:800;padding:1px 8px;border-radius:20px;border:1px solid currentColor;white-space:nowrap;margin-left:4px}
.attb.pos{color:var(--ok)}.attb.neu{color:var(--muted)}.attb.neg{color:var(--danger)}
.npc-card.att-pos{border-color:var(--ok)}
.npc-card.att-neg{border-color:var(--danger)}
.npc-field.hl{background:var(--accent-soft)}
.npc-card.att-pos .npc-field.hl{background:rgba(69,176,111,.12)}
.npc-card.att-neg .npc-field.hl{background:rgba(255,86,100,.10)}
.npc-item.att-pos{box-shadow:inset 3px 0 0 var(--ok)}
.npc-item.att-neg{box-shadow:inset 3px 0 0 var(--danger)}
.npc-item.att-neu{box-shadow:inset 3px 0 0 var(--muted)}
.npc-item details summary{cursor:pointer;font-size:12px;color:var(--muted)}
.npc-item details p{margin-top:4px}
.npc-item select{padding:3px 6px;font-size:12px}
.card-title.wrap{flex-wrap:wrap}
/* NSC-Zusätze */
.npc-extras{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--text)}
.npc-extras label{display:flex;align-items:center;gap:6px;cursor:pointer}
.npc-sec{padding:12px 16px;border-top:1px solid var(--border)}
.npc-sec .sec-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.npc-sec .sec-h .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
.stats label{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.stats input{padding:6px 8px;font-size:15px;font-weight:700;width:100%}
.tier{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tier .stepper span{min-width:96px;text-align:center;font-weight:700}
.items{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.items li{display:flex;align-items:center;gap:8px}
.items li span{flex:1}
.probes{display:flex;flex-direction:column;gap:8px}
.probe{border:1px solid var(--border);border-radius:9px;padding:9px 11px;background:var(--panel)}
.probe .ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.probe .pn{font-weight:800}
.probe .pd{font-size:12px;font-weight:800;padding:1px 8px;border-radius:20px;background:var(--panel3)}
.probe .pd.l0,.probe .pd.l1{background:rgba(69,176,111,.18);color:var(--ok)}
.probe .pd.l3,.probe .pd.l4{background:rgba(255,86,100,.14);color:var(--danger)}
.probe .ptag{font-size:11px;color:var(--muted)}
.probe p{font-size:13px;margin-top:4px}
.probe .res{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:13px;margin-top:4px}
.probe .res b{color:var(--muted);font-weight:700}
.npc-item .stats{grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:5px}
.npc-item .stats input{padding:3px 6px;font-size:13px}
.npc-item .probe{padding:6px 8px}
.npc-item .xtra{display:flex;flex-direction:column;gap:6px}

/* D&D 5e (2014) */
.dbad{font-size:11px;font-weight:700;border:1px solid var(--border);color:var(--muted);padding:1px 7px;border-radius:5px;white-space:nowrap}
.dbad.bad{color:var(--danger);border-color:var(--danger)}
.dbad.conc{color:var(--accent);border-color:var(--accent)}
.dbad.sl,.sl{color:var(--warn);border-color:var(--warn)}
.dtemp{font-size:12px;font-weight:700;color:var(--r2);margin-top:2px}
.dds{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;padding:6px 10px;border:1px dashed var(--danger);border-radius:8px;font-size:13px}
.pips{display:inline-flex;gap:3px}.pips i{width:12px;height:12px;border-radius:50%;border:2px solid currentColor;display:inline-block}
.pips.ok{color:var(--ok)}.pips.bad{color:var(--danger)}.pips i.on{background:currentColor}
.dpend{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;padding:5px 9px;border:1px solid var(--warn);border-radius:8px;font-size:13px}
input.dmini,select.dmini{width:74px;padding:4px 7px;font-size:13px}
input.dmini.wide{width:150px}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;font:600 12px var(--font);padding:0 2px;text-decoration:underline}
.linkbtn.danger{color:var(--danger)}
.dturn{margin-top:10px;padding:10px;border:1px solid var(--accent);border-radius:9px;background:var(--accent-soft)}
.dres{font:700 12px var(--font);padding:4px 10px;border-radius:20px;border:1px solid var(--border);cursor:pointer;background:var(--panel2);color:var(--text)}
.dres.on{border-color:var(--ok);color:var(--ok)}.dres.off{opacity:.55;text-decoration:line-through}
.dmove{font-size:13px}
.dacts{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
.btn.on{border-color:var(--accent);color:var(--accent)}
.dchk{display:inline-flex;align-items:center;gap:5px;font-size:13px;cursor:pointer}
.dwarn{font-size:13px;font-weight:700;color:var(--danger);margin-bottom:6px}
.datk{margin-top:8px;padding:10px;border:1px solid var(--border);border-radius:9px;background:var(--panel2)}
.datk select{padding:5px 8px;font-size:13px}
.dopts{margin-top:8px}
.dsrc{margin:8px 0 0;padding:0;list-style:none;font-size:13px}.dsrc b.adv{color:var(--ok)}.dsrc b.dis{color:var(--danger)}
.dverd{font-weight:900;font-size:16px;padding:4px 10px;border-radius:8px;border:1px solid var(--border)}
.dverd.hit{color:var(--ok);border-color:var(--ok)}.dverd.crit{color:var(--accent);border-color:var(--accent)}.dverd.miss{color:var(--muted)}
.dplan{margin-top:8px;padding:10px;border:1px solid var(--border);border-radius:9px}
.dsteps{margin:6px 0 0;padding-left:18px;font-size:13px}.dsteps li.ev{font-weight:700}
.ddet{margin-top:8px}.ddet summary{cursor:pointer;font-size:12px;color:var(--muted);font-weight:700}
.ddgrid{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}
.dslot{font-size:12px;border:1px solid var(--border);border-radius:6px;padding:2px 6px}
.chip.on{color:var(--ok);border-color:var(--ok)}.chip.off{color:var(--muted)}
button.chip{cursor:pointer;font:600 12px var(--font);padding:3px 10px}button.chip[data-act=dOA]{color:var(--text);border-color:var(--accent)}
.dcheck{margin-top:12px;border-top:1px solid var(--border);padding-top:10px}.dcheck summary{cursor:pointer;font-weight:700;font-size:13px}
.dcheck table td{padding:2px 8px 2px 0}
.dcondform{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-top:8px}
.dcondform select,.dcondform input{padding:5px 8px;font-size:13px}
.dref{padding:8px 0;border-bottom:1px solid var(--border)}.dref p{font-size:14px;margin:2px 0}
#dRefQ{width:100%}

/* Pathfinder 2e */
.pfpips{display:inline-flex;gap:3px;font-size:20px;line-height:1;color:var(--accent)}
.pfpip.used{color:var(--muted);opacity:.45}.pfpip.lost{color:var(--muted);text-decoration:line-through;opacity:.5}
.dcondform select[multiple]{min-width:120px}

/* Waffen */
.wsel select{max-width:220px}
.wpn{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.wpn select{padding:5px 8px;font-size:13px;max-width:260px}
.wpn .wbonus{width:110px;padding:5px 8px;font-size:13px}
.btn.crit{color:var(--accent);border-color:var(--accent)}
html[data-theme="clean"] .btn.crit{color:var(--text);border-color:var(--text)}
.atkres{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px;padding:10px 12px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:9px}
.atkres .big{font-size:28px;font-weight:900;line-height:1;min-width:36px;text-align:center}
.atkres .det{font-size:12px;color:var(--muted);flex:1;min-width:140px}
.atkres .det b{color:var(--text);font-size:13px}
.atkres .tgt{display:flex;align-items:center;gap:6px;font-size:13px}
.atkres select{padding:5px 8px;font-size:13px}
.wtable{width:100%;border-collapse:collapse;font-size:14px}
.wtable th{text-align:left;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:4px;border-bottom:1px solid var(--border)}
.wtable td{padding:5px 4px;border-bottom:1px solid var(--border)}
.modal .wtable td:first-child{width:auto}

/* Responsive */
@media (max-width:1180px){.app{grid-template-columns:180px minmax(0,1fr)}aside{grid-column:2;position:static;max-height:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}}
@media (max-width:780px){
 .cact .cbtns{max-width:none;justify-content:flex-start}
 .camp{flex-wrap:wrap}
 #systemSel{max-width:none;flex:1 1 100%}
 .npc-field{grid-template-columns:minmax(0,1fr) 34px !important;row-gap:2px}
 .npc-field .lbl{grid-column:1/-1}
 .npc-head{flex-wrap:wrap}
 .app{grid-template-columns:1fr;padding:12px;gap:12px}
 nav.side{flex-direction:row;overflow-x:auto;position:static;gap:6px}
 nav.side button{white-space:nowrap;padding:8px 10px}
 nav.side button kbd,nav.side .navnote{display:none}
 aside{grid-column:1}
 kbd{display:none}
 .crow{grid-template-columns:62px minmax(0,1fr)}
 .cact{grid-column:1/-1;flex-wrap:wrap}
 .tables{grid-template-columns:1fr}
 .entries{columns:1}
 .npc-field{grid-template-columns:90px minmax(0,1fr) 34px}
 header.top{padding:10px 12px}
 .hactions .lbl{display:none}
}
@media print{header.top,nav.side,aside{display:none}.app{display:block}}
.klrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}.klv{font-size:12px;padding:1px 7px;border-radius:999px;background:var(--bg2,rgba(127,127,127,.12))}.klv b{font-weight:600}
.klatks{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.klres{margin:6px 0;padding:6px 8px;border-left:3px solid var(--line,#888);font-size:13px}.klres.hit{border-color:var(--ok,#3a9)}.klres.miss{border-color:var(--bad,#c55)}
.klmon{display:flex;align-items:center;gap:2px;flex-wrap:wrap;font-size:12px;margin:2px 0}.klmon span{min-width:78px}.klmon i{width:11px;height:11px;border:1px solid currentColor;opacity:.6;display:inline-block}.klmon i.f{background:var(--bad,#c55);opacity:1;border-color:var(--bad,#c55)}.klmon small{margin-left:6px;opacity:.7}
.klatkedit{border-top:1px dashed var(--line,#8884);padding-top:6px}.klcondform{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}.klwide{grid-column:1/-1;min-width:0}.klwide:empty{display:none}.klatks .chip{color:var(--text);cursor:pointer;font:600 12px var(--font);padding:3px 10px}.klatks .chip.on{color:var(--ok)}.datk .row.wrap,.klrow{flex-wrap:wrap}.datk .dopts{margin-top:6px}
.demobar{position:sticky;top:0;z-index:50;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:6px 12px;font-size:13px;background:var(--accent);color:var(--on-accent)}.demobar b{font-weight:700}.demobar button{background:rgba(255,255,255,.18);color:inherit;border:0;border-radius:6px;padding:3px 10px;font:600 12px var(--font);cursor:pointer}
.demointro{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.82)}.demointro[hidden]{display:none}.demointro-box{max-width:1100px;width:100%;background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}.demointro-box img{display:block;width:100%;height:auto;max-height:72vh;object-fit:contain;background:#1a0a0a}.demointro-foot{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;font-size:14px;color:var(--muted)}
.demolist{max-height:50vh;overflow:auto;margin:0;padding:0;list-style:none}.demolist li{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px solid var(--border);font-size:13px}.demolist .zero{color:var(--danger)}
</style>

function probeLvl(key, n) {
  const P0 = PROBES[key], base = {pos: 1, neu: 2, neg: 3}[n.att] ?? 2;

  const adj = P0.easy.some(w => t.includes(w)) ? -1 : P0.hard.some(w => t.includes(w)) ? 1 : 0;
  return {lvl: Math.max(0, Math.min(4, base + adj)), adj};
}
function makeProbes(n, count) {
  const keys = Object.keys(PROBES), t = String(n.trait || '').toLowerCase();
  const fit = keys.filter(k => PROBES[k].easy.some(w => t.includes(w))).sort(() => Math.random() - .5);
  const rest = keys.filter(k => !fit.includes(k)).sort(() => Math.random() - .5);
  return [...fit.slice(0, 2), ...rest].slice(0, count || 3).map(k => makeProbe(k, n));
}
function makeProbe(k, n) {

}

function rollExpr(raw) {
  const s = String(raw).toLowerCase().replace(/\s+/g, '').replace(/w/g, 'd');
  if (!s || !/^[+-]?(\d*d\d+|\d+)([+-](\d*d\d+|\d+))*$/.test(s)) return null;
  const tokens = s.match(/[+-]?(\d*d\d+|\d+)/g);
  let total = 0; const parts = [], groups = [];
  for (const t of tokens) {
    const sign = t[0] === '-' ? -1 : 1;
    const body = t.replace(/^[+-]/, '');
    if (body.includes('d')) {
      let [n, f] = body.split('d');
      n = n === '' ? 1 : +n; f = +f;
      if (n < 1 || n > 100 || f < 2 || f > 1000) return null;
      const rolls = Array.from({length: n}, () => rnd(f) + 1);
      total += sign * rolls.reduce((a, b) => a + b, 0);
      groups.push({n, f, rolls});
      parts.push(`${sign < 0 ? '− ' : parts.length ? '+ ' : ''}${n}W${f} [${rolls.join(', ')}]`);
    } else {
      total += sign * +body;
      parts.push(`${sign < 0 ? '− ' : '+ '}${body}`);
    }
  }
  const r = {expr: s.replace(/d/g, 'W').replace(/^\+/, ''), total, detail: parts.join(' '), crit: null, msg: ''};
  evalCrit(r, groups);
  return r;
}
function evalCrit(r, groups) {
  if (groups.length !== 1) return;
  const g = groups[0], mode = P().crit;
  const count = v => g.rolls.filter(x => x === v).length;
  if (mode === 'd20' && g.n === 1 && g.f === 20) {
    if (g.rolls[0] === 20) { r.crit = 'crit'; r.msg = 'Natürliche 20!'; }
    else if (g.rolls[0] === 1) { r.crit = 'fumble'; r.msg = 'Natürliche 1!'; }
  }
  if (mode === 'dsa' && g.f === 20) {
    if (g.n === 1 && g.rolls[0] === 1) { r.crit = 'crit'; r.msg = 'Eine 1: möglicher kritischer Erfolg, Bestätigungswurf!'; }
    if (g.n === 1 && g.rolls[0] === 20) { r.crit = 'fumble'; r.msg = 'Eine 20: möglicher Patzer, Bestätigungswurf!'; }

  const role = K.jobs[pr.role] ? pr.role : pick(Object.keys(K.jobs));
  const att = ATT[pr.att] ? pr.att : pick(['pos','neu','neu','neg']);
  ui.draft = {culture: cult, g, age, role, att, name: makeName(cult, g), job: jobFor(K, role, g), ageText: pick(AGES[age]),
    look: pick(K.looks), trait: pick(TRAITS), quirk: pick(QUIRKS), motive: pick(K.motives), behavior: pick(ATT[att].lines), secret: pick(K.secrets)};
  const d = ui.draft;
  if (pr.xStats) d.stats = makeStats(pr.tier !== 'x' && pr.tier != null ? +pr.tier : pick(TIER_BY_ROLE[role] || [1]), S.system, role);
  if (pr.xItems) d.items = makeItems(C.set, role, 3);
  if (pr.xProbes) d.probes = makeProbes(d, 3);
}
function makeName(cult, g) {
  const C = CULTURES[cult];
  const used = new Set(S.npcs.map(n => n.name.split(' ')[0]));
  let first, tries = 0;
  do { first = pick(C[g]); tries++; } while (used.has(first) && tries < 60);
  return `${first} ${C.last(g)}`;
}
function rerollField(f) {
  const d = ui.draft; if (!d) return;
  const K = CONTENT[CULTURES[d.culture].set];
  const fn = {
    name: () => makeName(d.culture, d.g), job: () => jobFor(K, d.role, d.g), ageText: () => pick(AGES[d.age]),
    look: () => pick(K.looks), trait: () => pick(TRAITS), quirk: () => pick(QUIRKS), motive: () => pick(K.motives),
    behavior: () => pick(ATT[d.att].lines), secret: () => pick(K.secrets)
  }[f];
  if (!fn) return;
  const old = d[f]; let v, tries = 0;
  do { v = fn(); tries++; } while (v === old && tries < 10);
  d[f] = v;
  if (d.probes && ['trait','motive','secret','quirk','name'].includes(f)) d.probes = d.probes.map(p => makeProbe(p.k, d));
}

/* ---------- Log ---------- */
const TAG_RE = /(^|\s)([@#!])([0-9A-Za-zÄÖÜäöüßÀ-ÿ_\-]+)/g;
const isOpenThread = t => /(^|\s)![0-9A-Za-zÄÖÜäöüßÀ-ÿ_\-]+/.test(t);
function addLog(text) {
  S.log.push({id: uid(), session: S.session, time: nowTime(), ts: Date.now(), text, done: false});
  save();
}
function fmtLog(t) {
  return esc(t).replace(TAG_RE, (m, pre, sym, w) => `${pre}<button class="tag ${sym === '@' ? 'tp' : sym === '#' ? 'to' : 'tf'}" data-act="filterTag" data-tag="${esc(sym + w)}" title="Nach ${esc(sym + w)} filtern">${sym}${esc(w.replace(/_/g, ' '))}</button>`);
}

    <div class="hint"><code>@Name</code> markiert eine Person · <code>#Ort</code> einen Ort · <code>!Stichwort</code> einen offenen Handlungsfaden. Leerzeichen im Namen als Unterstrich: <code>@Alrik_Eichhorn</code>. Ein Klick auf eine Markierung filtert danach.</div>
  </div>

    <div class="row wrap gap filters">
      <select data-change="logSession" aria-label="Sitzung"><option value="all">Alle Sitzungen</option>${sessions.map(s => `<option value="${s}" ${String(ui.logSession) === String(s) ? 'selected' : ''}>Sitzung ${s}</option>`).join('')}</select>
      <input type="search" id="logSearch" placeholder="Im Log suchen…" value="${esc(ui.logSearch)}">
      <label class="chk"><input type="checkbox" data-change="logOpen" ${ui.logOpen ? 'checked' : ''}> Nur offene Fäden</label>
      ${ui.logTag ? `<span class="activefilter">Filter: <b>${esc(ui.logTag.replace(/_/g, ' '))}</b><button class="icon-btn" style="width:24px;height:24px" data-act="clearTag" aria-label="Filter entfernen">✕</button></span>` : ''}

}
function renderLogList() {

/* ---------- Tabellen ---------- */
const sysTable = () => ({id: 'sys', name: `Zustände (${P().short})`, entries: P().conds, readonly: true});
const allTables = () => [sysTable(), ...S.tables];
function parseEntries(t) {
  return t.entries.map(line => { const m = String(line).match(/^(\d+)\s*[x×]\s+(.+)$/i); return m ? {w: Math.max(1, +m[1]), text: m[2]} : {w: 1, text: String(line)}; }).filter(e => e.text.trim());
}
function rollTable(t) {
  const es = parseEntries(t); if (!es.length) return null;
  const tot = es.reduce((a, e) => a + e.w, 0);
  let r = rnd(tot);
  for (const e of es) { if (r < e.w) return e.text; r -= e.w; }
  return es[es.length - 1].text;
}
function currentTable() {
  const all = allTables();
  let t = all.find(x => x.id === ui.tableSel);
  if (!t) { t = all[1] || all[0]; ui.tableSel = t.id; }
  return t;
}

      <div class="row gap mt"><button class="btn primary">Speichern</button><button type="button" class="btn ghost" data-act="cancelTable">Abbrechen</button></div></form>`;
  else {
    const es = parseEntries(t);
    body = `<div class="row wrap gap"><h2 class="grow" style="font-size:20px">${esc(t.name)}</h2>
        <button class="btn sm ghost" data-act="pinTable" title="Als Spickzettel in der rechten Spalte anzeigen">${icon('pin')} ${S.pinned === t.id ? 'Lösen' : 'Anheften'}</button>

      ${ui.tableResult && ui.tableResult.id === t.id ? `<div class="result pop"><span>${esc(ui.tableResult.text)}</span><button class="btn sm" data-act="tableToLog" title="Ergebnis ins Sitzungs-Log schreiben">Ins Log</button></div>` : ''}
      <ol class="entries mt">${es.map(e => `<li class="${ui.tableResult && ui.tableResult.id === t.id && ui.tableResult.text === e.text ? 'hit' : ''}"><span>${esc(e.text)}</span>${e.w > 1 ? ` <small>(×${e.w})</small>` : ''}</li>`).join('')}</ol>`;
  }
  return `
  <div class="view-head"><div><h1>Tabellen</h1><p class="muted">Zufallstabellen und Spickzettel. Eigene Listen in Sekunden anlegen.</p></div></div>
  <div class="tables">

    <div class="card">${body}</div>
  </div>`;
}

document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.id === 'addForm') addCombatant(f);
  else if (f.classList.contains('condform')) {
    const x = findC(f.dataset.id); const fd = new FormData(f);
    const name = String(fd.get('cname') || '').trim();
    if (x && name) { x.conds.push({name, rounds: num(fd.get('crounds'))}); ui.condFor = null; save(); renderMain(); }
  }
  else if (f.id === 'partyForm') {
    const fd = new FormData(f); const name = String(fd.get('name') || '').trim(); if (!name) return;
    S.party.push({id: uid(), name, ini: num(fd.get('ini')), iniDice: num(fd.get('inidice')), hp: num(fd.get('hp')), r2: num(fd.get('r2')), def: num(fd.get('def')), weapon: String(fd.get('weapon') || '') || null, dmgBonus: String(fd.get('dmgBonus') || '').trim(), atk: num(fd.get('atk')), hero: fd.has('hero') ? num(fd.get('hero')) : undefined});

    const i = $('#partyForm input[name=name]'); if (i) i.focus();
  }
  else if (f.id === 'logForm' || f.id === 'quickNote') {
    const inp = f.querySelector('input[name=text]'); const t = inp.value.trim(); if (!t) return;
    addLog(t); inp.value = '';
    if (S.view === 'log') renderLogList();
    renderAside();
    if (f.id === 'quickNote') { toast('Notiz gespeichert'); const q = $('#quickNote input'); if (q) q.focus(); }
  }
  else if (f.classList.contains('logEdit')) {
    const e2 = S.log.find(x => x.id === f.dataset.id); const t = f.querySelector('input').value.trim();
    if (e2 && t) { e2.text = t; save(); }
    ui.editLog = null; renderLogList(); renderAside();
  }
  else if (f.id === 'weaponForm') {
    const fd = new FormData(f); const name = String(fd.get('name') || '').trim(); const dmg = String(fd.get('dmg') || '').trim();
    if (!name || !dmg) return;
    if (!rollExpr(dmg)) { toast('Ungültiger Schaden. Beispiele: 1W8, 2W6+3, 4', 'warn'); return; }
    S.weapons.push({id: uid(), sys: S.system, name, dmg: dmg.replace(/d/gi, 'W'), crit: S.system === 'sr6' ? 'none' : (String(fd.get('crit') || W().def)), threat: num(fd.get('threat')), type: S.system === 'sr6' ? String(fd.get('type') || 'K') : (isDnd() || isPf2()) ? (String(fd.get('type') || '') || null) : null, ranged: (isDnd() || isPf2()) ? !!fd.get('ranged') : undefined, traits: isPf2() ? {agile: !!fd.get('agile'), deadly: String(fd.get('deadly') || '').trim(), fatal: String(fd.get('fatal') || '').trim()} : undefined});
    save(); manageWeapons(); renderMain(); toast(`${name} angelegt`);
    const i = $('#weaponForm input[name=name]'); if (i) i.focus();
  }
  else if (f.id === 'diceForm') { const v = f.querySelector('input').value; doRoll(rollExpr(v)); const i = $('#diceForm input'); if (i) i.value = v; }
  else if (f.id === 'poolForm') { const n = num(f.querySelector('input').value) || 1; S.poolSize = n; doRoll(rollPool(n)); }
  else if (f.id === 'tableEdit') {
    const t = currentTable(); if (t.readonly) return; const fd = new FormData(f);
    t.name = String(fd.get('name') || '').trim() || 'Ohne Namen';
    t.entries = String(fd.get('entries') || '').split('\n').map(s => s.trim()).filter(Boolean);

});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const fn = actions[b.dataset.act]; if (fn) { e.preventDefault(); fn(b, e); }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]'); if (!el) return;
  const fn = changes[el.dataset.change]; if (fn) fn(el);
});
document.addEventListener('input', e => {
  if (e.target.id === 'npcSearch') { ui.npcSearch = e.target.value; renderNpcList(); }
  if (e.target.id === 'logSearch') { ui.logSearch = e.target.value; renderLogList(); }
  if (e.target.id === 'campaign') { S.campaign = e.target.value; save(); }
  if (e.target.id === 'tickCost') { const v = num(e.target.value); if (v) { S.combat.lastCost = v; save(); } }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.classList && t.classList.contains('amt') && e.key === 'Enter') { e.preventDefault(); changeVal(t.dataset.id, 'hp', e.shiftKey ? 1 : -1); return; }
  if (t.id === 'tickCost' && e.key === 'Enter') { e.preventDefault(); nextTurn(); return; }
  if (t.matches && t.matches('.ini input') && e.key === 'Enter') { t.blur(); return; }
  if (e.key === 'Escape') { if ($('#overlay')) closeModal(); else if (ui.condFor) { ui.condFor = null; renderMain(); } return; }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable;
  if (typing || e.ctrlKey || e.metaKey || e.altKey || $('#overlay')) return;
  const k = e.key.toLowerCase();
  if (['1','2','3','4'].includes(k)) { S.view = VIEWS[+k - 1][0]; save(); render(); }
  else if (k === 'n' && S.view === 'combat') { e.preventDefault(); S.combat.active ? nextTurn() : startCombat(); }
  else if (k === 'g') { if (S.view !== 'npc') { S.view = 'npc'; save(); } genNpc(); render(); }
  else if (k === 'w') doRoll(rollExpr('1W20'));
  else if (k === 'l') { e.preventDefault(); const q = $('#quickNote input'); if (q) q.focus(); }
  else if (e.key === '?') showHelp();
});

/* ================= Sichern / Laden ================= */
function exportText() { return JSON.stringify({app: 'spielleiter-toolkit', version: 2, exported: new Date().toISOString(), state: S}, null, 2); }
function showCopyBox(txt) {
  openModal('Daten kopieren', `<p class="small muted">Markiere den Text (Strg+A) und kopiere ihn (Strg+C). Speichere ihn in einer Textdatei.</p><textarea id="copyBox" rows="10" readonly>${esc(txt)}</textarea>`, '<button class="btn" data-act="closeModal">Fertig</button>');
  const b = $('#copyBox'); if (b) { b.focus(); b.select(); }
}
function exportData() {
  S.lastExport = Date.now(); save();
  const blob = new Blob([exportText()], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `spielleiter-toolkit_${slug(S.campaign)}_${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Sicherungsdatei wird heruntergeladen');
}
$('#importFile').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => importText(reader.result);
  reader.readAsText(file);
  e.target.value = '';
});
function importText(raw) {
  let obj;
  try { obj = JSON.parse(raw); } catch (err) { toast('Die Daten konnten nicht gelesen werden.', 'warn'); return; }
  if (!obj || obj.app !== 'spielleiter-toolkit' || !obj.state) { toast('Das sind keine Daten des Spielleiter-Toolkits.', 'warn'); return; }
  confirmBox(`Kampagne „${obj.state.campaign || 'ohne Namen'}“ laden? Die aktuellen Daten werden ersetzt.`, 'Laden', () => {
    S = normalize(obj.state); S.seenWelcome = true; S.seenSystem = true; save();
    Object.assign(ui, {draft: null, condFor: null, logTag: null, tableSel: null, tableResult: null, lastRoll: null, editLog: null});
    render(); toast('Kampagne geladen');
  });
}

    house: {fumble: {label: 'Hausregel: Patzerfolgen bei natürlicher 1 (nur Hinweis)'}, weaponCrit: {label: 'Hausregel: eigene Krit-Regeln der Waffen statt Würfelverdopplung'}}

const isDnd = () => !!(typeof P === 'function' && P().rules && DND_RULESETS[P().rules]);
const RS = () => DND_RULESETS[P().rules] || DND_RULESETS['2014'];

const DND = {
  mod: v => Math.floor((v - 10) / 2),
  pb: lvl => lvl >= 17 ? 6 : lvl >= 13 ? 5 : lvl >= 9 ? 4 : lvl >= 5 ? 3 : 2,
  // Bonus aus Attribut/Stufe ODER Gesamtbonus (Übungsbonus darin wird nicht erneut addiert)
  bonus(o) {
    if (o.total != null && o.total !== '') return {bonus: +o.total, text: `Gesamtbonus ${fmtB(+o.total)} (enthält bereits alle Boni)`};
    const m = DND.mod(+o.score || 10), p = o.prof ? DND.pb(+o.level || 1) * (o.expert ? 2 : 1) : 0, misc = +o.misc || 0;
    const bits = [`Attribut ${o.score || 10} → ${fmtB(m)}`];
    if (o.prof) bits.push(`Übung ${fmtB(p)}${o.expert ? ' (Expertise: Übungsbonus verdoppelt)' : ''}`);
    if (misc) bits.push(`sonstiges ${fmtB(misc)}`);
    return {bonus: m + p + misc, text: bits.join(', ')};
  },
  // Mehrere Quellen gleicher Art stapeln nicht; Vorteil + Nachteil heben sich auf.
  mode(advN, disN) { advN = +advN || 0; disN = +disN || 0; return advN > 0 && disN > 0 ? 'normal' : advN > 0 ? 'adv' : disN > 0 ? 'dis' : 'normal'; },
  modeText(advN, disN) {
    const m = DND.mode(advN, disN);
    if (advN > 0 && disN > 0) return `normaler Wurf: ${advN}× Vorteil und ${disN}× Nachteil heben sich auf`;
    if (m === 'adv') return advN > 1 ? `Vorteil (${advN} Quellen zählen nur einmal)` : 'Vorteil';
    if (m === 'dis') return disN > 1 ? `Nachteil (${disN} Quellen zählen nur einmal)` : 'Nachteil';
    return 'normaler Wurf';
  },
  d20(mode) {
    const a = rnd(20) + 1;
    if (mode !== 'adv' && mode !== 'dis') return {mode: 'normal', dice: [a], nat: a};
    const b = rnd(20) + 1;
    return {mode, dice: [a, b], nat: mode === 'adv' ? Math.max(a, b) : Math.min(a, b)};
  },
  // Probe auswerten. kind: free|check|save|attack|init|death
  resolve(kind, nat, bonus, target, opts = {}) {
    const total = nat + (bonus || 0), r = {kind, nat, total, success: null, crit: false, why: ''};
    if (kind === 'attack') {
      if (nat === 20) { r.success = true; r.crit = true; r.why = 'Natürliche 20: automatischer Treffer und kritischer Treffer.'; }
      else if (nat === 1) { r.success = false; r.why = 'Natürliche 1: automatischer Fehlschlag.' + (opts.fumble ? ' Hausregel aktiv: Patzerfolgen nach Absprache.' : ''); }
      else if (target == null || target === '') { r.why = 'Keine RK bekannt – Spielleitung entscheidet.'; }
      else { r.success = total >= target; r.why = `${total} ${r.success ? '≥' : '<'} RK ${target}: ${r.success ? 'Treffer' : 'verfehlt'}.`; }
    } else if (kind === 'check' || kind === 'save') {
      if (opts.autoFail) { r.success = false; r.why = opts.autoFail; return r; }
      if (target == null || target === '') r.why = 'Kein SG angegeben.';
      else { r.success = total >= target; r.why = `${total} ${r.success ? '≥' : '<'} SG ${target}: ${r.success ? 'Erfolg' : 'Misserfolg'}.` + (nat === 20 || nat === 1 ? ` Die natürliche ${nat} entscheidet bei ${kind === 'save' ? 'Rettungswürfen' : 'Attributswürfen'} nicht automatisch.` : ''); }
    } else if (kind === 'init') r.why = 'Initiative: Geschicklichkeitswurf; Reihenfolge absteigend.';
    else if (kind === 'free') r.why = nat === 20 || nat === 1 ? `Natürliche ${nat} – ohne Wurfkontext kein Regelerfolg.` : '';
    return r;
  },
  // Schadensausdruck in Würfelgruppen und festen Bonus zerlegen
  parse(expr) {
    const s = String(expr || '').toLowerCase().replace(/\s+/g, '').replace(/w/g, 'd');
    if (!s) return {groups: [], flat: 0};
    if (!/^[+-]?(\d*d\d+|\d+)([+-](\d*d\d+|\d+))*$/.test(s)) return null;
    const out = {groups: [], flat: 0};
    (s.match(/[+-]?(\d*d\d+|\d+)/g) || []).forEach(t => {
      const sg = t[0] === '-' ? -1 : 1, b = t.replace(/^[+-]/, '');
      if (b.includes('d')) { const [n, f] = b.split('d'); out.groups.push({n: n === '' ? 1 : +n, f: +f, sg}); }
      else out.flat += sg * +b;
    });
    return out;
  },
  fmt(p) {
    const g = p.groups.map((x, i) => `${x.sg < 0 ? '−' : i ? '+' : ''}${x.n}W${x.f}`).join(' ');
    const f = p.flat ? `${p.flat < 0 ? ' − ' : g ? ' + ' : ''}${Math.abs(p.flat)}` : '';
    return (g + f) || '0';
  },
  // Kritisch: alle Schadenswürfel des Angriffs doppelt, feste Boni einmal
  critExpr(expr) { const p = DND.parse(expr); if (!p) return null; return DND.fmt({groups: p.groups.map(g => ({...g, n: g.n * 2})), flat: p.flat}); },
  rollParsed(p) {
    let total = p.flat; const det = [];
    p.groups.forEach(g => { const rolls = Array.from({length: g.n}, () => rnd(g.f) + 1); const s = rolls.reduce((a, b) => a + b, 0); total += g.sg * s; det.push(`${g.sg < 0 ? '−' : ''}${g.n}W${g.f} [${rolls.join(', ')}]`); });
    if (p.flat) det.push(`${p.flat < 0 ? '−' : '+'} ${Math.abs(p.flat)}`);
    return {total, detail: det.join(' ')};
  },
  // Schadensteile eines Angriffs würfeln: [{expr, type, crit:true|false}]
  rollParts(parts, isCrit) {
    return parts.filter(pt => pt.expr).map(pt => {
      const p = DND.parse(pt.expr); if (!p) return null;
      const doubled = isCrit && pt.crit !== false && p.groups.length > 0;
      const use = doubled ? {groups: p.groups.map(g => ({...g, n: g.n * 2})), flat: p.flat} : p;
      const r = DND.rollParsed(use);
      return {type: pt.type || '', amt: Math.max(0, r.total), expr: DND.fmt(use), detail: r.detail, doubled, label: pt.label || ''};
    });
  },
  effMax(x) { const d = dd(x); return x.maxHp == null ? null : d.exh >= 4 ? Math.floor(x.maxHp / 2) : x.maxHp; },
  hasCond: (x, n) => (x.conds || []).some(c => c.name === n),
  flags(x) { const C = RS().conds, f = {}; (x.conds || []).forEach(c => { const k = C[c.name]; if (k) Object.keys(k).forEach(j => { if (j !== 'd') f[j] = 1; }); }); if (x.hp === 0 && x.maxHp != null) f.incap = 1; return f; },
  incap(x) { const d = dd(x); return !!(DND.flags(x).incap || d.dead); },
  effSpeed(x) {
    const d = dd(x), f = DND.flags(x);
    if (f.speed0 || f.noMove || d.exh >= 5 || d.dead || x.hp === 0) return 0;
    let v = +d.speed || 0; if (d.exh >= 2) v = Math.floor(v / 2 / 1.5) * 1.5;
    return v;
  },
  // Passende Modifikatoren: Immunität → 0, Resistenz halbiert (abgerundet), danach Anfälligkeit ×2
  modsFor(x, type, magical) {
    const d = dd(x), m = {imm: false, res: false, vul: false, why: []};
    const match = (list) => (list || []).find(e => e.t === type && (!e.nm || (!magical && RS().physical.includes(type))));
    const im = match(d.imm), rs = match(d.res), vu = match(d.vul);
    if (im) { m.imm = true; m.why.push(`Immunität gegen ${type}${im.nm ? ' (nichtmagisch)' : ''}`); }
    if (rs) { m.res = true; m.why.push(`Resistenz gegen ${type}${rs.nm ? ' (nichtmagisch)' : ''}`); }
    if (DND.flags(x).resAll && !m.res) { m.res = true; m.why.push('Resistenz gegen alle Schadensarten (Versteinert)'); }
    if (vu) { m.vul = true; m.why.push(`Anfälligkeit für ${type}`); }
    return m;
  },
  // Vorschau ohne Änderung. parts: [{amt, type}] einer Schadensquelle
  plan(x, parts, o = {}) {
    const d = dd(x), steps = [], ev = [];
    let total = 0;
    parts.forEach(pt => {
      let v = Math.max(0, Math.floor(+pt.amt || 0)); const t = pt.type || '';
      const m = t ? DND.modsFor(x, t, !!o.magical) : {imm: false, res: false, vul: false, why: []};
      let line = `${v}${t ? ' ' + t : ''}`;
      if (m.imm) { v = 0; line += ' → Immunität: 0'; }
      else {
        if (m.res) { v = Math.floor(v / 2); line += ` → Resistenz: ${v}`; }
        if (m.vul) { v = v * 2; line += ` → Anfälligkeit: ${v}`; }
      }
      total += v; steps.push(line);
    });
    const temp = d.tempHp || 0, absorbed = Math.min(temp, total), hpDmg = total - absorbed;
    if (absorbed) steps.push(`Temporäre TP fangen ${absorbed} ab (${temp} → ${temp - absorbed})`);
    const p = {total, absorbed, hpDmg, newTemp: temp - absorbed, newHp: x.hp, steps, ev, dead: d.dead, ds: {...d.ds}, stable: d.stable, unconscious: false, concDC: null, concEnds: false};
    if (x.hp == null) { p.steps.push('Keine TP eingetragen – nur Anzeige.'); return p; }
    if (d.dead) { p.steps.push('Kreatur ist bereits tot.'); return p; }
    const mx = DND.effMax(x) || 0;
    if (x.hp > 0) {
      const rest = x.hp - hpDmg;
      if (rest > 0) p.newHp = rest;
      else {
        p.newHp = 0; const over = -rest;
        if (hpDmg > 0 && over >= mx && mx > 0) { p.dead = true; ev.push(`Massiver Schaden: Restschaden ${over} ≥ TP-Maximum ${mx} → sofortiger Tod`); }
        else if (o.nonlethal && o.melee) { p.unconscious = true; p.stable = true; ev.push('Nichttödlicher Nahkampfangriff: bewusstlos und stabil'); }
        else if (d.deathMode === 'dead') { p.dead = true; ev.push('0 TP: Kreatur ist besiegt/tot (Einstellung „Bei 0 TP besiegt/tot“)'); }
        else { p.unconscious = true; ev.push('0 TP: bewusstlos, Todesrettungswürfe beginnen'); }
      }
    } else if (total > 0) {
      // bereits bei 0 TP
      if (hpDmg >= mx && mx > 0) { p.dead = true; ev.push(`Schaden ${hpDmg} bei 0 TP ≥ TP-Maximum ${mx} → sofortiger Tod`); }
      else {
        const n = o.crit ? 2 : 1; p.ds.f = Math.min(3, p.ds.f + n); p.stable = false;
        ev.push(`Schaden bei 0 TP: ${n} Fehlschlag${n > 1 ? 'e (kritischer Treffer)' : ''} beim Todesrettungswurf${d.stable ? '; Stabilität endet' : ''}`);
        if (p.ds.f >= 3) { p.dead = true; ev.push('Drei Fehlschläge: tot'); }
      }
    }
    if (d.conc && total > 0) {
      if (p.dead || p.unconscious) { p.concEnds = true; ev.push(`Konzentration auf „${d.conc.spell}“ endet (${p.dead ? 'Tod' : 'kampfunfähig'})`); }
      else { p.concDC = DND.concDC(total); ev.push(`Konzentrationswurf (KON) nötig: SG ${p.concDC} = max(10, ${total} ÷ 2 abgerundet)`); }
    }
    return p;
  },
  concDC: dmg => Math.max(10, Math.floor(dmg / 2)),
  // Plan übernehmen
  apply(x, p, o = {}) {
    const d = dd(x);
    d.tempHp = p.newTemp;
    if (x.hp == null || d.dead) return;
    x.hp = p.newHp; d.ds = {...p.ds}; d.stable = p.stable;
    if (p.unconscious) { d.ds = {s: 0, f: 0}; DND.addCond(x, 'Bewusstlos', {src: '0 TP', auto: '0tp'}); DND.addCond(x, 'Liegend', {src: '0 TP'}); }
    if (p.dead) DND.kill(x);
    if (p.concEnds) DND.endConc(x, p.dead ? 'Tod' : 'Kampfunfähig');
    else if (p.concDC) d.concPending = (d.concPending || []).concat([{dc: p.concDC, dmg: p.total, id: uid()}]);
  },
  kill(x) { const d = dd(x); d.dead = true; d.stable = false; d.ds = {s: 0, f: 3}; x.hp = x.hp == null ? null : 0; d.concPending = []; if (d.conc) DND.endConc(x, 'Tod'); },
  heal(x, amt) {
    const d = dd(x), why = [];
    if (d.dead) return {ok: false, why: 'Tote Kreaturen werden durch normale Heilung nicht wiederbelebt.'};
    if (x.hp == null) return {ok: false, why: 'Keine TP eingetragen.'};
    const mx = DND.effMax(x), before = x.hp;
    x.hp = Math.min(mx, x.hp + Math.max(0, amt));
    why.push(`${before} + ${amt} → ${x.hp} (Maximum ${mx}${mx !== x.maxHp ? ', durch Erschöpfung halbiert' : ''})`);
    if (before === 0 && x.hp > 0) { d.ds = {s: 0, f: 0}; d.stable = false; DND.rmAuto(x, '0tp'); why.push('Wieder bei Bewusstsein, Todesrettungswürfe zurückgesetzt (bleibt liegend)'); }
    return {ok: true, why: why.join('; ')};
  },
  // Temporäre TP addieren sich nicht – Auswahl zwischen altem und neuem Vorrat
  setTemp(x, v) { dd(x).tempHp = Math.max(0, Math.floor(v)); },
  deathSave(x, nat, bonus) {
    const d = dd(x), total = nat + (bonus || 0), out = {nat, total, text: ''};
    if (nat === 1) { d.ds.f = Math.min(3, d.ds.f + 2); out.text = 'Natürliche 1: zwei Fehlschläge.'; }
    else if (nat === 20) { d.ds = {s: 0, f: 0}; d.stable = false; x.hp = 1; DND.rmAuto(x, '0tp'); out.text = 'Natürliche 20: 1 TP zurück, wieder bei Bewusstsein.'; return out; }
    else if (total >= 10) { d.ds.s += 1; out.text = `${total} ≥ 10: ein Erfolg.`; }
    else { d.ds.f += 1; out.text = `${total} < 10: ein Fehlschlag.`; }
    if (d.ds.f >= 3) { DND.kill(x); out.text += ' Drei Fehlschläge: tot.'; }
    else if (d.ds.s >= 3) { DND.stabilize(x); out.text += ' Drei Erfolge: stabil.'; }
    return out;
  },
  stabilize(x) { const d = dd(x); d.stable = true; d.ds = {s: 0, f: 0}; },
  dying: x => { const d = dd(x); return x.hp === 0 && x.maxHp != null && !d.dead && !d.stable && d.deathMode === 'saves'; },
  // Zustände
  addCond(x, name, o = {}) {
    if (o.auto && x.conds.some(c => c.auto === o.auto && c.name === name)) return;
    if (o.src === '0 TP' && x.conds.some(c => c.name === name)) return;
    x.conds.push({id: uid(), name, src: o.src || '', end: o.end || {type: 'manual'}, rounds: o.rounds ?? null, auto: o.auto || null});
    if (RS().conds[name] && RS().conds[name].incap && dd(x).conc) DND.endConc(x, `${name} (kampfunfähig)`);
  },
  rmAuto(x, tag) { x.conds = x.conds.filter(c => !(c.auto === tag)); },

  endConc(x, why) {

    d.conc = null; d.concPending = [];
    try { addLog(`Konzentration von @${tagName(x)} auf „${spell}“ endet: ${why}${removed ? ` (${removed} verknüpfte Wirkung${removed > 1 ? 'en' : ''} entfernt)` : ''}`); } catch (e) {}

function dndNewD(pc, src) {

}

/* ---------- Zugablauf ---------- */
function turnStartHook(x) {
  if (isPf2()) return pfTurnStart(x);
  if (!isDnd()) { if (isKl()) klTurnStart(x); return tickConditions(x); }
  if (!x) return;
  const d = dd(x), msgs = [];
  // Reaktion erst zu Beginn des eigenen Zuges wieder verfügbar
  d.act = {a: true, b: true, r: !d.surprised};
  d.flags = {};
  if (d.readied && d.readied.spell && d.conc && /^vorbereitet/.test(d.conc.spell)) DND.endConc(x, 'vorbereiteter Zauber nicht ausgelöst – verfällt');
  d.readied = null;
  d.move = DND.effSpeed(x);
  if (d.surprised) { d.act.a = false; d.act.b = false; d.move = 0; msgs.push('überrascht: keine Bewegung, keine Aktion, keine Reaktion bis Zugende'); }
  // Zustände, die zu Beginn dieses Zuges enden oder herunterzählen
  S.combat.list.forEach(t => {
    t.conds = t.conds.filter(c => {
      const e = c.end || {};
      if (e.type === 'turnStart' && e.who === x.id) { msgs.push(`${c.name} bei ${t.name} endet`); return false; }
      if (e.type === 'rounds' && (e.who || t.id) === x.id) {
        c.rounds = (c.rounds ?? 1) - 1;
        if (c.rounds <= 0) { msgs.push(`${c.name} bei ${t.name} endet (Dauer abgelaufen)`); return false; }
      }
      return true;
    });
  });
  if (DND.dying(x)) { d.dsPending = true; msgs.push('Todesrettungswurf fällig'); }
  if (msgs.length) toast(`${x.name}: ${msgs.join(' · ')}`);
}
function turnEndHook(x) {
  if (isPf2()) return pfTurnEnd(x);
  if (!isDnd() || !x) return;
  const d = dd(x), msgs = [];
  if (d.surprised) { d.surprised = false; d.act.r = true; msgs.push('Überraschung vorbei, Reaktion wieder möglich'); }
  S.combat.list.forEach(t => {
    t.conds = t.conds.filter(c => {
      const e = c.end || {};
      if (e.type === 'turnEnd' && e.who === x.id) { msgs.push(`${c.name} bei ${t.name} endet`); return false; }
      return true;
    });
  });
  x.conds.forEach(c => { if (c.end && c.end.type === 'save') { c.savePending = true; msgs.push(`${c.name}: Rettungswurf ${c.end.ab} SG ${c.end.dc} am Zugende`); } });
  if (msgs.length) toast(`${x.name}: ${msgs.join(' · ')}`);
}

/* ---------- Migration (alte Spielstände, Importe) ---------- */
function dndMigrateState(s) {
  if (!s) return;
  s.dnd = Object.assign({feet: false, house: {fumble: false, weaponCrit: false}}, s.dnd || {});
  s.dnd.house = Object.assign({fumble: false, weaponCrit: false}, s.dnd.house || {});
  if (!s.combat || !Array.isArray(s.combat.undo)) { if (s.combat) s.combat.undo = []; }
  if (!SYSTEMS[s.system] || !SYSTEMS[s.system].rules) return;
  (s.combat.list || []).forEach(x => {
    if (!Array.isArray(x.conds)) x.conds = [];
    const d = dd(x);
    // dmgBonus bleibt Schadensbonus – nie in Angriffsbonus umwandeln
    x.conds = x.conds.filter(c => {
      if (!c.id) c.id = uid();
      if (!c.end) c.end = c.rounds != null ? {type: 'rounds', who: x.id} : {type: 'manual'};
      if (c.name === 'Konzentration') { if (!d.conc) d.conc = {spell: 'unbenannt (übernommen)', since: 1}; return false; }
      if (c.name === 'Erschöpft' || c.name === 'Erschöpfung') { d.exh = Math.max(d.exh, 1); return false; }
      return true;
    });
  });
}

  return {x, parts, o};
}
function dndDmgPreview() {

function dndDmgApply() {
  const r = dndDmgRead(); if (!r || !r.x) return;

  const pl = DND.plan(r.x, r.parts, r.o); DND.apply(r.x, pl); dndAfterChange(r.x, pl);
  closeModal(); save(); renderMain(); renderAside();
}

function dndCondSubmit(f) {
  const x = findC(f.dataset.id); if (!x) return;

  else if (end === 'save') { const dc = num(fd.get('dc')); if (!dc) { toast('SG für den Rettungswurf eintragen', 'warn'); return; } o.end = {type: 'save', ab: String(fd.get('ab')), dc}; }

function dndCheckCalcText() {

  return `${esc(b.text)} → <b>${fmtB(b.bonus)}</b>${c.mode === 'calc' ? ` · Übungsbonus Stufe ${esc(c.level)}: ${fmtB(DND.pb(+c.level || 1))}` : ''}`;
}
function dndCheckRead(f) {
  const fd = new FormData(f), c = ui.dndCheck;
  c.kind = String(fd.get('kind') || c.kind); if (fd.get('mode')) c.mode = String(fd.get('mode'));
  ['total','target'].forEach(k => { if (fd.has(k)) c[k] = String(fd.get(k)).trim(); });
  ['score','level','misc','adv','dis'].forEach(k => { if (fd.has(k)) c[k] = num(fd.get(k)) ?? c[k]; });
  if (c.mode === 'calc' && f.querySelector('[name=score]')) { c.prof = !!fd.get('prof'); c.expert = !!fd.get('expert') && c.prof; }
}
function dndCheckRoll() {
  const c = ui.dndCheck, b = c.kind === 'free' ? {bonus: 0} : DND.bonus(c.mode === 'total' ? {total: c.total === '' ? 0 : c.total} : {...c, total: null});
  const kindL = {free: 'Freier W20', check: 'Attributswurf', save: 'Rettungswurf', attack: 'Angriffswurf', init: 'Initiative', death: 'Todesrettungswurf'}[c.kind];
  if (c.kind === 'death') {
    const nat = rnd(20) + 1, total = nat + b.bonus;
    const msg = nat === 1 ? 'Natürliche 1: zählt als zwei Fehlschläge.' : nat === 20 ? 'Natürliche 20: Kreatur erhält 1 TP zurück.' : total >= 10 ? `${total} ≥ 10: ein Erfolg.` : `${total} < 10: ein Fehlschlag.`;
    doRoll({expr: kindL, total, detail: `W20 [${nat}] ${fmtB(b.bonus)}`, crit: nat === 20 ? 'crit' : nat === 1 ? 'fumble' : null, msg}); return;
  }
  const mode = c.kind === 'init' ? 'normal' : DND.mode(c.adv, c.dis), dr = DND.d20(mode);
  const target = c.target === '' ? null : +c.target;
  const r = DND.resolve(c.kind, dr.nat, b.bonus, target, {fumble: S.dnd.house.fumble});
  doRoll({expr: `${kindL}${mode !== 'normal' ? ` (${mode === 'adv' ? 'Vorteil' : 'Nachteil'})` : ''}`, total: r.total, detail: `W20 [${dr.dice.join(', ')}]${dr.dice.length > 1 ? ` → ${dr.nat}` : ''} ${fmtB(b.bonus)}${target != null && c.kind !== 'free' ? ` · ${c.kind === 'attack' ? 'RK' : 'SG'} ${target}` : ''}`,
    crit: c.kind === 'attack' && dr.nat === 20 ? 'crit' : c.kind === 'attack' && dr.nat === 1 ? 'fumble' : null, msg: r.why});
}

/* ---------- Rasten ---------- */
function dndRestModal(kind) {
  const L = S.combat.list.filter(x => x.hp != null);
  if (!L.length) { toast('Keine Kreaturen mit TP in der Liste', 'warn'); return; }
  if (kind === 'short') {
    openModal('Kurze Rast (mind. 1 Stunde)', `<p class="small muted">Trefferwürfel einzeln ausgeben: je Würfel + KON-Modifikator, mindestens 0 Heilung. Ressourcen mit „kurze Rast“ werden aufgefüllt, wenn du die Rast abschließt.</p>
      ${L.map(x => { const d = dd(x); return `<div class="party-row"><b>${esc(x.name)}</b><span class="small">${x.hp}/${DND.effMax(x)} TP · TW ${d.hd.cur}/${d.hd.total} (W${d.hd.die}${d.hd.con ? ' ' + fmtB(+d.hd.con) : ''})</span><button class="btn sm" data-act="dHD" data-id="${x.id}" ${d.hd.cur > 0 && !d.dead && x.hp < DND.effMax(x) ? '' : 'disabled'}>1 TW ausgeben</button></div>`; }).join('')}`,
      `<button class="btn ghost" data-act="closeModal">Abbrechen</button><button class="btn primary" data-act="dRestDone" data-k="short">Kurze Rast abschließen</button>`, true);
  } else {
    openModal('Lange Rast (mind. 8 Stunden)', `<p class="small muted">Voraussetzungen nach SRD: mindestens 8 Stunden, höchstens 2 Stunden leichte Tätigkeit, keine wirksame lange Rast in den letzten 24 Stunden, mindestens 1 TP zu Beginn.</p>
      <label class="dchk"><input type="checkbox" id="lr8" checked> mindestens 8 Stunden, nicht unterbrochen</label><br>
      <label class="dchk"><input type="checkbox" id="lr24" checked> keine lange Rast in den letzten 24 Stunden</label><br>
      <label class="dchk"><input type="checkbox" id="lrFood"> ausreichend gegessen und getrunken (Erschöpfung −1)</label>
      <ul class="small">${L.map(x => `<li>${esc(x.name)}: ${dd(x).dead ? 'tot – keine Wirkung' : x.hp < 1 ? '0 TP zu Beginn – keine Wirkung' : 'TP voll, Trefferwürfel bis zur Hälfte, Zauberplätze und Ressourcen „lange/kurze Rast“'}</li>`).join('')}</ul>`,
      `<button class="btn ghost" data-act="closeModal">Abbrechen</button><button class="btn primary" data-act="dRestDone" data-k="long">Lange Rast abschließen</button>`, true);
  }
}
function dndRestDone(kind) {
  const L = S.combat.list.filter(x => x.hp != null);
  if (kind === 'long') {
    if (!$('#lr8').checked || !$('#lr24').checked) { toast('Voraussetzungen nicht erfüllt – keine wirksame lange Rast', 'warn'); return; }
    const food = $('#lrFood').checked;
    dndUndoPush('Lange Rast');
    L.forEach(x => {
      const d = dd(x); if (d.dead || x.hp < 1) return;
      if (food && d.exh > 0) d.exh -= 1;
      x.hp = DND.effMax(x); d.tempHp = 0; d.ds = {s: 0, f: 0}; d.stable = false;
      const gain = Math.max(1, Math.floor((+d.hd.total || 0) / 2)); if (+d.hd.total) d.hd.cur = Math.min(+d.hd.total, (+d.hd.cur || 0) + gain);
      (d.spell.slots || []).forEach(s => { if (s) s.cur = s.max; });
      (d.resources || []).forEach(r => { if (r.rec === 'long' || r.rec === 'short') r.cur = r.max; });
    });
    addLog('Lange Rast abgeschlossen');
  } else {
    dndUndoPush('Kurze Rast');
    L.forEach(x => (dd(x).resources || []).forEach(r => { if (r.rec === 'short') r.cur = r.max; }));
    addLog('Kurze Rast abgeschlossen');
  }
  closeModal(); save(); renderMain(); renderAside(); toast(kind === 'long' ? 'Lange Rast abgeschlossen' : 'Kurze Rast abgeschlossen');
}

function dndRules(q) {

  const html = list.map(([t, d, r]) => `<div class="dref"><b>${esc(t)}</b><p>${esc(d)}</p><small class="muted">SRD 5.1 DE · ${esc(r)}</small></div>`).join('') || '<p class="muted">Keine Treffer.</p>';
  if ($('#dRefList')) { $('#dRefList').innerHTML = html; return; }

}

}
function pfPlanHtml(t, pl) {

}
function pfAtkRoll() {
  const a = ui.pfAtk; if (!a || a.roll) return;
  const c = pfAtkCalc(a), x = c.x, p = c.p, t = c.t;
  if (!a.undoPushed) { dndUndoPush(`Angriff von ${x.name}`); a.undoPushed = true; }
  if (a.reactive) { if (!p.act.r) { toast('Reaktion bereits verbraucht', 'warn'); return; } p.act.r = false; p.act.log.push(`${PFI.r} Reaktiver Schlag`); }
  else pfSpend(x, a.src === 'spellAtk' ? +a.cost : 1, a.src === 'spellAtk' ? 'Zauberangriff' : a.src === 'athletics' ? 'Athletik-Angriff' : 'Schlag');
  if (a.src === 'spellAtk') pfPaySpell(x, a);
  const d = PFR.d20(a.fortune, a.misfortune);
  const dc = a.src === 'athletics' ? num(a.athDC) : c.ac;
  const r = PFR.degree(d.nat, c.mod, dc, a.src === 'athletics' ? 'check' : 'attack');
  if (c.on) p.attacks += 1;
  a.roll = Object.assign(r, {dice: d.dice, how: d.how, fortuneUsed: !!(a.fortune && !a.misfortune), label: `${a.reactive ? 'Reaktiver Schlag' : a.src === 'spellAtk' ? 'Zauberangriff' : a.src === 'athletics' ? 'Athletik-Angriff' : 'Schlag'} von ${x.name}${t ? ' auf ' + t.name : ''} · ${c.mapText}`});
  a.crit = r.deg === 3;
  pfLogDice(`${x.name}: ${a.roll.label}`, r.total, `W20 [${d.dice.join(', ')}] ${fmtB(c.mod)}${dc != null ? ` gegen ${a.src === 'athletics' ? 'SG' : 'RK'} ${dc}` : ''}`, r.why, r.deg === 3 ? 'crit' : r.deg === 0 ? 'fumble' : null);
  if (r.deg === 3) addLog(`Kritischer Treffer: @${tagName(x)}${t ? ' gegen @' + tagName(t) : ''}`);
  save(); renderMain(); renderAside(true);
}
function pfPaySpell(x, a) {
  const p = pp(x), rk = num(a.rank);
  if (a.focus) { if (p.spell.focus > 0) p.spell.focus -= 1; else toast('Keine Fokuspunkte mehr', 'warn'); }
  else if (a.useSlot && rk) { const s = p.spell.slots[rk - 1]; if (s && s.cur > 0) s.cur -= 1; else toast(`Kein Zauberplatz Rang ${rk} frei`, 'warn'); }
  p.act.log.push(`Zauber${rk ? ' Rang ' + rk : ' (Trick)'}`);
}
function pfSaveRoll() {
  const a = ui.pfAtk; if (!a || a.save) return;
  const x = findC(a.by), t = findC(a.tgt), p = pp(x), tp = pp(t); if (!x || !t) return;
  if (!a.undoPushed) { dndUndoPush(`Zauber von ${x.name}`); a.undoPushed = true; }
  pfSpend(x, +a.cost, 'Zauber (Rettungswurf)'); pfPaySpell(x, a);
  const dc = p.spell.dc + PFR.stack(PFR.condMods(x, 'spelldc')).total;
  const st = PFR.stack(PFR.condMods(t, a.saveKind)), bonus = (+tp.saves[a.saveKind] || 0) + st.total;
  const d = PFR.d20(false, false), r = PFR.degree(d.nat, bonus, dc, 'save');
  const nm = {fort: 'Zähigkeit', ref: 'Reflex', will: 'Wille'}[a.saveKind];
  a.save = Object.assign(r, {dice: d.dice, how: d.how, label: `${nm}-Rettungswurf ${fmtB(+tp.saves[a.saveKind] || 0)}${st.text ? ` (${st.text})` : ''} gegen SG ${dc}`});
  pfLogDice(`${t.name}: ${a.save.label}`, r.total, `W20 [${d.dice.join(', ')}] ${fmtB(bonus)}`, r.why);
  save(); renderMain(); renderAside(true);
}
function pfAtkDamage() {
  const a = ui.pfAtk, x = findC(a.by), t = findC(a.tgt); if (!a || a.dmg) return;
  let parts;
  if (a.src === 'strike') { const sd = pfStrikeData(x); if (!sd.expr || !DND.parse(sd.expr)) { toast('Schaden eintragen (z. B. 1W8+4)', 'warn'); return; } parts = PFR.rollStrike(sd.expr, {crit: (a.override ?? a.roll.deg) === 3, type: sd.type, deadly: sd.deadly, fatal: sd.fatal, striking: pp(x).striking, label: sd.name}); }
  else {
    if (!a.spellDmg || !DND.parse(a.spellDmg)) { toast('Schaden des Zaubers eintragen', 'warn'); return; }
    const crit = a.src === 'spellAtk' && (a.override ?? a.roll.deg) === 3;
    parts = PFR.rollStrike(a.spellDmg, {crit, type: a.spellType, label: 'Zauber' + (crit ? ' (kritisch ×2 laut üblichem Zaubertext)' : '')});
    if (a.src === 'spellSave') {
      const deg = a.override ?? a.save.deg;
      parts.forEach(q => { const raw = q.amt; if (a.basic) { q.amt = PFR.basic(raw, deg); q.detail += ` → ${PFR.basicWhy[deg]}: ${q.amt}`; } else { const f = +a.onSave; q.amt = Math.floor(raw * f); q.detail += ` → laut Zauber ×${String(f).replace('.', ',')}: ${q.amt}`; } });
    }
  }
  a.dmg = parts;
  a.critForDying = a.src === 'spellSave' ? (a.override ?? a.save.deg) === 0 : (a.override ?? (a.roll && a.roll.deg)) === 3;
  a.plan = t ? PFR.plan(t, parts, {crit: a.critForDying, heroic: a.heroic}) : null;
  pfLogDice(`${x.name}: Schaden`, parts.reduce((s, q) => s + q.amt, 0), parts.map(q => `${q.expr} → ${q.detail}`).join(' · '), '', a.critForDying ? 'crit' : null);
  save(); renderMain(); renderAside(true);
}
function pfAtkApply() {
  const a = ui.pfAtk, t = a && findC(a.tgt); if (!a || !t || !a.dmg || a.applied) return;
  if (!a.undoPushed) { dndUndoPush(`Schaden an ${t.name}`); a.undoPushed = true; }
  const pl = PFR.plan(t, a.dmg, {crit: a.critForDying, heroic: a.heroic});
  PFR.apply(t, pl); a.applied = true; pfAfter(t, pl);
  save(); renderMain(); renderAside();
}
function pfAfter(t, pl) {
  pl.ev.forEach(e => { if (/tot|Sterbend|ausscheid|bewusstlos|Heroische/.test(e)) addLog(`@${tagName(t)}: ${e}`); });
  toast(`${t.name}: ${pl.total} Schaden${pl.absorbed ? ` (${pl.absorbed} von temp. TP)` : ''}${pl.ev.length ? ' · ' + pl.ev[0] : ''}`);
}

function pfDmgRead() {

function pfDmgPreview() { const r = pfDmgRead(), b = $('#pfDmgPrev'); if (r && b) b.innerHTML = `<b>Vorschau</b>${pfPlanHtml(r.x, PFR.plan(r.x, r.parts, r.o))}`; }

    <label class="f">Quelle<input name="src" placeholder="z. B. Ghul" maxlength="40"></label>
    <label class="f">Endet<select name="end"><option value="auto">Standard (Verängstigt: −1 am Zugende)</option><option value="manual">manuell</option><option value="turnStart">zu Beginn des Zuges von …</option><option value="turnEnd">am Ende des Zuges von …</option><option value="rounds">nach Runden (bei Zugbeginn von …)</option><option value="save">bei gelungenem Rettungswurf (Zugende)</option>${casters.length ? '<option value="sustain">wenn nicht aufrechterhalten</option>' : ''}</select></label>
    <label class="f">… von<select name="who">${opts(S.combat.currentId || x.id)}</select></label>
    <label class="f w70">Runden<input name="rounds" type="number" min="1" placeholder="1"></label>
    <label class="f">RW<select name="save"><option>Zähigkeit</option><option>Reflex</option><option>Wille</option></select></label><label class="f w70">SG<input name="dc" type="number" placeholder="20"></label>
    ${casters.length ? `<label class="f">Effekt<select name="link">${casters.map(o => pp(o).sustain.map(s => `<option value="${s.id}">${esc(o.name)}: ${esc(s.name)}</option>`).join('')).join('')}</select></label>` : ''}
    <label class="f">Nur gegenüber<select name="vs" multiple size="2" title="Nur für „Auf dem falschen Fuß“: leer = gegenüber allen">${L.filter(o => o.id !== x.id).map(o => `<option value="${o.id}">${esc(o.name)}</option>`).join('')}</select></label>
    <label class="dchk"><input type="checkbox" name="dur"> Betäubt mit Dauer</label>

    <p class="hint">Wert und Dauer sind getrennt. Gleiche Zustände aus mehreren Quellen werden getrennt geführt; es zählt jeweils der höchste Wert.</p></form>`;
}
function pfCondSubmit(f) {
  const x = findC(f.dataset.id); if (!x) return; const fd = new FormData(f), name = String(fd.get('name')), end = String(fd.get('end')), who = String(fd.get('who') || x.id);
  const o = {src: String(fd.get('src') || '').trim(), value: num(fd.get('value')), dur: !!fd.get('dur'), quickFor: String(fd.get('quickFor') || '').trim(), vs: name === 'Auf dem falschen Fuß' ? fd.getAll('vs').map(String) : []};
  if (PF_RULES.conds[name] && PF_RULES.conds[name].val && !o.value && !(name === 'Betäubt' && o.dur)) o.value = 1;
  if (!(PF_RULES.conds[name] && PF_RULES.conds[name].val)) o.value = null;
  if (end === 'turnStart' || end === 'turnEnd') o.end = {type: end, who};
  else if (end === 'rounds') { const r = num(fd.get('rounds')); if (!r) { toast('Runden eintragen', 'warn'); return; } o.end = {type: 'rounds', who}; o.rounds = r; }
  else if (end === 'save') { const dc = num(fd.get('dc')); if (!dc) { toast('SG eintragen', 'warn'); return; } o.end = {type: 'save', save: String(fd.get('save')), dc}; }
  else if (end === 'sustain') o.end = {type: 'sustain', link: String(fd.get('link'))};
  else if (end === 'manual') o.end = {type: 'manual'};
  dndUndoPush(`${name} bei ${x.name}`); PFR.addCond(x, name, o); ui.pfCondFor = null; save(); renderMain();
}

function pfCheckBase() { const c = ui.pfCheck; return c.mode === 'total' ? {b: num(c.total) || 0, t: `Gesamtbonus ${fmtB(num(c.total) || 0)} (Bestandteile bereits enthalten)`} : {b: PFR.rank(c.lvl, +c.rank) + (+c.attr || 0) + (+c.item || 0), t: `Kompetenz ${fmtB(PFR.rank(c.lvl, +c.rank))} + Attribut ${fmtB(+c.attr || 0)} + Gegenstand ${fmtB(+c.item || 0)}`}; }
function pfCheckCalcText() { const c = ui.pfCheck, b = pfCheckBase(), st = PFR.stack(c.mods.filter(m => m.v)); return `${esc(b.t)}${st.text ? ' · ' + esc(st.text) : ''}${st.ignored.length ? ' · ' + esc(st.ignored.join('; ')) : ''} → <b>${fmtB(b.b + st.total)}</b>`; }
function pfCheckRead(f) {

  ['total', 'dc'].forEach(k => { if (fd.has(k)) c[k] = String(fd.get(k)).trim(); });
  ['lvl', 'rank', 'attr', 'item'].forEach(k => { if (fd.has(k)) c[k] = num(fd.get(k)) ?? c[k]; });
  if (fd.has('mt0')) { c.mods = [0, 1].map(i => ({type: String(fd.get('mt' + i)), v: num(fd.get('mv' + i)), src: `Eingabe ${i + 1}`})); c.fortune = !!fd.get('fortune'); c.misfortune = !!fd.get('misfortune'); c.secret = !!fd.get('secret'); }
}
function pfCheckRoll() {
  const c = ui.pfCheck, dc = c.dc === '' ? null : +c.dc;
  if (c.kind === 'flat') { const nat = rnd(20) + 1, r = PFR.flat(dc ?? 11, nat); doRoll({expr: `Einfacher Wurf SG ${dc ?? 11}`, total: nat, detail: `W20 [${nat}]`, crit: null, msg: r.why}); return; }
  const b = pfCheckBase(), st = PFR.stack(c.mods.filter(m => m.v)), mod = b.b + st.total, d = PFR.d20(c.fortune, c.misfortune);

  if (c.secret) { S.pf.secret.unshift(Object.assign({t: nowTime()}, entry)); S.pf.secret = S.pf.secret.slice(0, 20); doRoll({expr: `Geheimer ${name}`, total: '?', detail: 'verdeckt – nur für die Spielleitung', crit: null, msg: ''}); return; }

/* ---------- Begegnungsplanung ---------- */
function pfXp(diff) { return PF_RULES.xpByDiff[String(diff)] ?? null; }

function pfEvalPlan(pl) {
  const lvl = +pl.lvl || 1, pcs = +pl.pcs || 4, rows = (pl.foes || []).map(f => { const diff = (+f.lvl) - lvl, xp = pfXp(diff); return {...f, diff, xp, sum: xp == null ? null : xp * (+f.n || 1)}; });
  const unknown = rows.filter(r => r.xp == null), total = rows.reduce((s, r) => s + (r.sum || 0), 0), B = pfBudget(pcs);
  const exact = B.find(b => b.b === total), above = B.filter(b => b.b < total).pop(), below = B.find(b => b.b > total);
  const threat = exact ? exact.l : !below ? `über ${B[4].l} (${B[4].b})` : total <= B[0].b ? `${B[0].l} (bis ${B[0].b})` : `zwischen ${above.l} (${above.b}) und ${below.l} (${below.b})`;
  const award4 = exact ? PF_RULES.budgets.find(b => b[0] === exact.k)[2] : null;
  const scaled = Math.round(total * 4 / pcs);
  return {rows, unknown, total, B, threat, exact, award: award4, scaled};
}

function pfPlanToCombat(pl) {

  let U = {}; try { U = JSON.parse(localStorage.getItem(UKEY)) || {}; } catch (e) {}
